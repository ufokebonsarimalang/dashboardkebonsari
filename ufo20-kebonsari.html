<script>
document.addEventListener('contextmenu', e => e.preventDefault());
document.onkeydown = function(e) {
  if (e.keyCode == 123) return false;
  if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
  if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false;
  if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
  if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
}
</script>

<!-- ===== showToast DULU supaya tidak race condition ===== -->
<script>
function showToast(pesan, tipe) {
  tipe = tipe || 'info';
  var old = document.querySelector('.custom-toast');
  if (old) old.remove();
  var toast = document.createElement('div');
  toast.className = 'custom-toast';
  
  var icon = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>';
  if (tipe === 'sukses') icon = '<svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
  else if (tipe === 'error') icon = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
  
  toast.innerHTML = icon + ' <span>' + pesan + '</span>';
  document.body.appendChild(toast);
  setTimeout(function(){ toast.classList.add('show'); }, 10);
  setTimeout(function(){
    toast.classList.remove('show');
    setTimeout(function(){ toast.remove(); }, 300);
  }, 3500);
}
window.showToast = showToast;
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, get, update, remove, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCcBuaevlaemlP2mX87gGi2JwGR29Y05as",
  authDomain: "dashboardkebonsari.firebaseapp.com",
  databaseURL: "https://dashboardkebonsari-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "dashboardkebonsari",
  storageBucket: "dashboardkebonsari.firebasestorage.app",
  messagingSenderId: "68113369328",
  appId: "1:68113369328:web:200be7e778bdc9104b5a35"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

window.db = db; window.dbRef = ref; window.dbSet = set; window.dbGet = get;
window.dbUpdate = update; window.dbRemove = remove; window.dbOnValue = onValue;
window.dbPush = push;
window.firebaseAuth = auth;
window.firebaseSignInWithPopup = signInWithPopup;
window.firebaseGoogleAuthProvider = GoogleAuthProvider;
window.firebaseSignOut = signOut;

onAuthStateChanged(auth, async (user) => {
  if (user && user.email) {
    const emailKey = user.email.replace(/\./g, ',');
    try {
      const snap = await get(ref(db, 'users/whitelist/' + emailKey));
      if (snap.exists() && snap.val().role === 'ADMIN') {
        const wl = snap.val();
        let namaTampil = wl.nama || '';
        if (!namaTampil && wl.promotorKey) {
          const snapM = await window.dbGet(window.dbRef(window.db, 'users/master_promotor/' + wl.promotorKey));
          if (snapM.exists()) namaTampil = snapM.val().namaAbsen || '';
        }
        window.adminUser = { ...user, namaTampil: namaTampil || 'Admin' };
      } else {
        showToast('Akun Anda bukan Admin!', 'error');
        await signOut(auth);
      }
    } catch (err) { console.error(err); }
  } else {
    window.adminUser = null;
  }
  window.dispatchEvent(new Event('firebase-ready'));
});
</script>

<style>
:root {
  --bg: #f8fafc; --card: #ffffff; --soft: #f1f5f9;
  --text: #0f172a; --muted: #64748b; --border: #e2e8f0;
  --primary: #4f46e5; --primary-dark: #4338ca;
  --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
  --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05);
  --shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -4px rgba(0,0,0,0.05);
  --radius: 16px;
}
* { box-sizing: border-box; font-family: 'Inter', sans-serif !important; -webkit-font-smoothing: antialiased; }
body { margin: 0; padding: 24px; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }
.container { width: 100%; max-width: 1100px; background: var(--card); border-radius: 24px; padding: 32px; box-shadow: 0 20px 40px -10px rgba(0,0,0,0.08); min-height: 90vh; border: 1px solid rgba(255,255,255,0.5); }

/* ===== HEADER ===== */
.header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 24px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
.header-left { display: flex; align-items: center; gap: 16px; }
.header-logo { width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, var(--primary), #818cf8); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 16px -4px rgba(79,70,229,0.4); }
.header-logo svg { width: 24px; height: 24px; stroke: white; stroke-width: 2.5; fill: none; }
.header-title h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
.header-title p { margin: 4px 0 0; font-size: 13px; color: var(--muted); font-weight: 500; }
.header-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.header-user { padding: 8px 16px; background: #ecfdf5; color: #065f46; border-radius: 99px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; border: 1px solid #a7f3d0; }
.header-user::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #10b981; }
.badge-bulan { padding: 8px 16px; background: #eff6ff; color: #1e40af; border-radius: 99px; font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; border: 1px solid #bfdbfe; }

/* ===== TABS ===== */
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; background: var(--soft); padding: 8px; border-radius: 16px; border: 1px solid var(--border); }
.tab-btn { flex: 1; min-width: 110px; padding: 12px 10px; border-radius: 12px; background: transparent; border: none; color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; display: flex; flex-direction: column; align-items: center; gap: 6px; transition: all 0.25s; }
.tab-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2.2; fill: none; }
.tab-btn:hover { background: white; color: var(--primary); }
.tab-btn.active { background: white; color: var(--primary); box-shadow: 0 4px 12px rgba(79,70,229,0.15); border: 1px solid rgba(79,70,229,0.1); }

/* ===== CARDS & FORMS ===== */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow-sm); }
.card h3 { margin: 0 0 16px; font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
.card h3 svg { width: 20px; height: 20px; stroke: var(--primary); stroke-width: 2.5; fill: none; }
.card p { margin: 0 0 16px; font-size: 13px; color: var(--muted); line-height: 1.6; }

label { display: block; font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
input, select, textarea { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--soft); font-size: 14px; font-weight: 600; color: var(--text); outline: none; transition: all 0.2s; }
input:focus, select:focus, textarea:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 4px rgba(79,70,229,0.1); }

/* ===== BUTTONS ===== */
button { padding: 12px 20px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.2s; display: inline-flex; justify-content: center; align-items: center; gap: 8px; }
button svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.5; fill: none; }
button:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.btn-primary { background: linear-gradient(135deg, var(--primary), #6366f1); color: white; box-shadow: 0 4px 12px rgba(79,70,229,0.25); }
.btn-success { background: linear-gradient(135deg, #10b981, #059669); color: white; }
.btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
.btn-warning { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; }
.btn-soft { background: white; color: var(--text); border: 1px solid var(--border); }
.btn-sm { padding: 8px 14px; font-size: 11px; width: auto; border-radius: 8px; }
.btn-full { width: 100%; }

/* ===== UPLOAD AREA ===== */
.file-wrap { border: 2px dashed #cbd5e1; border-radius: var(--radius); padding: 32px 20px; text-align: center; cursor: pointer; background: var(--soft); transition: all 0.25s; }
.file-wrap:hover { background: #eff6ff; border-color: var(--primary); }
.file-wrap svg { width: 48px; height: 48px; stroke: var(--primary); stroke-width: 1.5; fill: none; margin-bottom: 12px; }
.file-wrap p { margin: 0; font-size: 14px; color: var(--muted); font-weight: 600; }
.file-wrap strong { color: var(--primary); }
.file-wrap input { display: none; }

/* ===== ALERTS ===== */
.alert { padding: 14px 16px; border-radius: 12px; font-size: 13px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: flex-start; gap: 10px; line-height: 1.5; }
.alert.ok { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
.alert.err { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
.alert.warn { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }

.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
.spinner-dark { border: 2px solid rgba(0,0,0,0.1); border-top-color: var(--primary); }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== LIST ITEMS ===== */
.list-item { background: white; border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 16px; transition: all 0.2s; flex-wrap: wrap; }
.list-item:hover { box-shadow: var(--shadow); border-color: #cbd5e1; }
.list-item .kiri { flex: 1; min-width: 0; }
.list-item .nama { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.list-item .detail { font-size: 12px; color: var(--muted); margin-top: 4px; font-weight: 500; line-height: 1.6; }
.list-item .kanan { display: flex; gap: 8px; flex-shrink: 0; align-items: center; flex-wrap: wrap; }
.list-item.late-item { border-left: 4px solid var(--warning); background: #fffbeb; }

/* ===== STATS ===== */
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.stat-card { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 20px 16px; text-align: center; }
.stat-card .label { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.stat-card .value { font-size: 24px; font-weight: 900; }
.stat-card.full { grid-column: 1 / -1; background: linear-gradient(135deg, #f0fdf4, #dcfce7); border-color: #bbf7d0; }
.stat-card.success .value { color: #059669; }

.late-marker { background: #fef3c7; border: 1px solid #fcd34d; border-radius: 8px; padding: 4px 10px; font-size: 10px; font-weight: 800; color: #92400e; text-transform: uppercase; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 16px; }

.welcome-card { background: linear-gradient(135deg, #1e293b, #0f172a); color: white; border-radius: var(--radius); padding: 28px; margin-bottom: 24px; position: relative; overflow: hidden; }
.welcome-card h2 { margin: 0 0 8px; font-size: 24px; font-weight: 800; }
.welcome-card p { margin: 0; font-size: 14px; opacity: 0.8; color: #cbd5e1; }

#loginBox { max-width: 400px; margin: 40px auto; }
#loginBox .card { background: white; padding: 32px; border-radius: 24px; }
#loginBox h3 { font-size: 20px; text-align: center; margin-bottom: 24px; justify-content: center; }

/* ===== CUSTOM MODAL ===== */
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.6); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 99999; opacity: 0; visibility: hidden; transition: all 0.3s; padding: 16px; overflow-y: auto; }
.modal-overlay.active { opacity: 1; visibility: visible; }
.modal-box { background: white; border-radius: 24px; padding: 32px; max-width: 500px; width: 100%; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); transform: scale(0.9) translateY(20px); transition: transform 0.3s; margin: auto; }
.modal-overlay.active .modal-box { transform: scale(1) translateY(0); }
.modal-icon { width: 72px; height: 72px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 20px; }
.modal-icon.warning { background: #fef3c7; color: #d97706; }
.modal-icon.success { background: #ecfdf5; color: #10b981; }
.modal-icon.danger { background: #fef2f2; color: #ef4444; }
.modal-icon.info { background: #eff6ff; color: #3b82f6; }
.modal-icon svg { width: 36px; height: 36px; stroke: currentColor; stroke-width: 2.5; fill: none; }
.modal-title { font-size: 20px; font-weight: 800; margin-bottom: 12px; text-align: center; }
.modal-desc { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 28px; white-space: pre-line; text-align: center; }
.modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-actions.single { grid-template-columns: 1fr; }
.modal-actions.three { grid-template-columns: 1fr; gap: 8px; }
.modal-btn { padding: 14px 20px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; text-transform: uppercase; letter-spacing: 0.5px; display: inline-flex; justify-content: center; align-items: center; gap: 8px; font-family: inherit; }
.modal-btn-cancel { background: var(--soft); color: var(--text); border: 1px solid var(--border); }
.modal-btn-ok-primary { background: linear-gradient(135deg, var(--primary), #6366f1); color: white; }
.modal-btn-ok-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
.modal-btn-ok-success { background: linear-gradient(135deg, #10b981, #059669); color: white; }
.modal-btn-ok-warning { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; }

/* ===== CUSTOM TOAST ===== */
.custom-toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-20px); background: rgba(15,23,42,0.95); color: #fff; padding: 16px 24px; border-radius: 14px; font-size: 14px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); z-index: 999999; opacity: 0; visibility: hidden; transition: all 0.3s; display: flex; align-items: center; gap: 12px; backdrop-filter: blur(10px); max-width: 90%; }
.custom-toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
.custom-toast svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2.5; fill: none; }

.hidden { display: none !important; }
.sop-preview { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); }

@media (max-width: 768px) {
  body { padding: 12px; }
  .container { padding: 20px; border-radius: 20px; }
  .header { flex-direction: column; align-items: flex-start; gap: 16px; }
  .header-right { width: 100%; justify-content: space-between; }
  .tabs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .tab-btn { padding: 12px 8px; font-size: 11px; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .form-grid, .form-grid-3 { grid-template-columns: 1fr; }
  .list-item { flex-direction: column; align-items: stretch; gap: 12px; }
  .list-item .kanan { justify-content: flex-end; }
  .modal-actions.three { grid-template-columns: 1fr; }
}
</style>
</head>

<script>
/* ===== MODAL HELPERS ===== */
let _modalCallback = null;
function tampilkanModal(title, desc, opts, onOk) {
  opts = opts || {};
  const type = opts.type || 'warning';
  const showCancel = opts.showCancel !== false;
  document.getElementById('modalTitle').innerText = title;
  document.getElementById('modalDesc').innerText = desc;
  const iconEl = document.getElementById('modalIcon');
  iconEl.className = 'modal-icon ' + type;
  let iconSvg = '';
  if (type === 'warning') iconSvg = '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>';
  else if (type === 'success') iconSvg = '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>';
  else if (type === 'danger') iconSvg = '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>';
  else iconSvg = '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>';
  iconEl.innerHTML = '<svg viewBox="0 0 24 24">' + iconSvg + '</svg>';
  const actionsEl = document.getElementById('modalActions');
  const btnClass = type === 'danger' ? 'modal-btn-ok-danger' : type === 'success' ? 'modal-btn-ok-success' : type === 'warning' ? 'modal-btn-ok-warning' : 'modal-btn-ok-primary';
  if (opts.customActions) {
    actionsEl.className = 'modal-actions ' + (opts.customActions.length === 3 ? 'three' : '');
    actionsEl.innerHTML = opts.customActions.map(a => `<button class="modal-btn ${a.class}" onclick="${a.onclick}">${a.text}</button>`).join('');
  } else if (showCancel) {
    actionsEl.className = 'modal-actions';
    actionsEl.innerHTML = `<button class="modal-btn modal-btn-cancel" onclick="tutupModal()">${opts.cancelText || 'Batal'}</button><button class="modal-btn ${btnClass}" onclick="konfirmasiModal()">${opts.okText || 'OK'}</button>`;
  } else {
    actionsEl.className = 'modal-actions single';
    actionsEl.innerHTML = `<button class="modal-btn ${btnClass}" onclick="tutupModal()">${opts.okText || 'OK'}</button>`;
  }
  _modalCallback = onOk || null;
  document.getElementById('modalPopup').classList.add('active');
}
function tutupModal() { document.getElementById('modalPopup').classList.remove('active'); _modalCallback = null; }
function konfirmasiModal() { const cb = _modalCallback; tutupModal(); if (cb) cb(); }
function tampilkanNotif(title, desc, type) { tampilkanModal(title, desc, { type: type || 'info', showCancel: false, okText: 'OK' }, null); }
function tampilkanKonfirmasi(title, desc, onOk, type) { tampilkanModal(title, desc, { type: type || 'warning', showCancel: true }, onOk); }

function getBulanIni() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function getNamaBulanIndo(bulanStr) {
  const nama = ['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const [thn, bln] = bulanStr.split('-');
  return `${nama[parseInt(bln)]} ${thn}`;
}

function sanitizeKey(nama) { return String(nama || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '_').replace(/_+/g, '_'); }

function cariPromotorKeyBySalesId(namaSalesId) {
  const s = String(namaSalesId || '').trim().toUpperCase();
  if (!s) return null;
  for (const k of Object.keys(allMaster)) {
    if (String(allMaster[k].namaSalesId || '').trim().toUpperCase() === s) return k;
  }
  for (const k of Object.keys(allMaster)) {
    const p = allMaster[k];
    const ns = String(p.namaSalesId || '').trim().toUpperCase();
    if (ns && (s.includes(ns) || ns.includes(s))) return k;
  }
  return null;
}

function cariPromotorKeyByFinger(namaFinger) {
  const s = String(namaFinger || '').trim().toUpperCase();
  if (!s) return null;
  for (const k of Object.keys(allMaster)) {
    if (String(allMaster[k].namaFinger || '').trim().toUpperCase() === s) return k;
  }
  for (const k of Object.keys(allMaster)) {
    const p = allMaster[k];
    const nf = String(p.namaFinger || '').trim().toUpperCase();
    if (nf && (s.includes(nf) || nf.includes(s))) return k;
  }
  return null;
}

async function loginAdminGoogle() {
  const errEl = document.getElementById('loginError');
  errEl.classList.add('hidden');
  try {
    const provider = new window.firebaseGoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    const result = await window.firebaseSignInWithPopup(window.firebaseAuth, provider);
    const user = result.user;
    const emailKey = user.email.replace(/\./g, ',');
    const snap = await window.dbGet(window.dbRef(window.db, 'users/whitelist/' + emailKey));
    if (snap.exists() && snap.val().role === 'ADMIN') {
      const wl = snap.val();
      let namaTampil = wl.nama || '';
      if (!namaTampil && wl.promotorKey) {
        const snapM = await window.dbGet(window.dbRef(window.db, 'users/master_promotor/' + wl.promotorKey));
        if (snapM.exists()) namaTampil = snapM.val().namaAbsen || '';

      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('panelAdmin').classList.remove('hidden');
      document.getElementById('headerUser').classList.remove('hidden');
      document.getElementById('btnLogoutHeader').classList.remove('hidden');
      document.getElementById('headerUser').innerHTML = `${namaTampil || 'Admin'}`;
      window.adminUser = { ...user, namaTampil: namaTampil || 'Admin' };

/* ===== CONVERTERS ===== */
function convertTanggalExcel(val) {
  if (val === undefined || val === null || val === '') return '';
  if (typeof val === 'number' && val > 1 && val < 100000) {
    const epochMs = Date.UTC(1899, 11, 30);
    const ms = epochMs + val * 24 * 60 * 60 * 1000;
    const d = new Date(ms);
    return String(d.getUTCDate()).padStart(2,'0') + '/' + String(d.getUTCMonth()+1).padStart(2,'0') + '/' + d.getUTCFullYear();
  }
  const str = String(val).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(str)) { const p = str.split(' ')[0].split('-'); return `${p[2]}/${p[1]}/${p[0]}`; }
  return str;
}
function convertJam(val) {
  if (val === undefined || val === null || val === '') return '';
  if (typeof val === 'number') {
    if (val === 0 || isNaN(val)) return '';
    const totalMenit = Math.round(val * 24 * 60);
    return String(Math.floor(totalMenit/60)%24).padStart(2,'0') + ':' + String(totalMenit%60).padStart(2,'0');
  }
  return String(val).trim();
}
function parseAngka(val) {
  if (val === '' || val === null || val === undefined) return 0;
  if (typeof val === 'number') return val;
  const s = String(val).replace(/[^\d.-]/g, '');
  const n = Number(s);
  return isNaN(n) ? 0 : n;
}

function handleFileFinger(e) {
  const file = e.target.files[0];
  if (!file) return;
  const el = document.getElementById('fingerInfo');
  el.innerHTML = '<div class="alert warn"><span class="spinner spinner-dark"></span> Membaca...</div>';
  const reader = new FileReader();
  reader.onload = async (evt) => {
    try {
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const sheetName = wb.SheetNames.find(n => n.toLowerCase().includes('punch') || n.toLowerCase().includes('raw')) || wb.SheetNames[0];
      const sheet = wb.Sheets[sheetName];
      if (!sheet) { el.innerHTML = '<div class="alert err">Sheet tidak ditemukan!</div>'; return; }
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      const absensiData = {};
      let promotorCount = 0, hariCount = 0;
      const skipList = [];
      const bulanIni = getNamaBulanIndo(BULAN_INI);
      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        if (!row || !row[0]) continue;
        const m = String(row[0]).match(/Nama:(\S+)/);
        if (!m) continue;
        const namaFinger = m[1].trim();
        const foundKey = cariPromotorKeyByFinger(namaFinger);
        if (!foundKey) { if (skipList.indexOf(namaFinger) === -1) skipList.push(namaFinger); continue; }
        const foundPromotor = allMaster[foundKey];
        const dateRow = rows[i + 1], jamRow = rows[i + 2];
        if (!dateRow || !jamRow) continue;
        if (!absensiData[foundKey]) absensiData[foundKey] = {};
        promotorCount++;
        for (let col = 1; col < Math.max(dateRow.length, jamRow.length); col++) {
          const hariNum = parseInt(dateRow[col]) || 0;
          const jamStr = String(jamRow[col] || '').trim();
          if (hariNum < 1 || hariNum > 31 || !jamStr) continue;
          const jamParts = jamStr.split(/\s+/).filter(j => j.includes(':'));
          let masuk='', ist1='', kem1='', ist2='', kem2='', pulang='';
          switch(jamParts.length) {
            case 1: masuk=jamParts[0]; break;
            case 2: masuk=jamParts[0]; pulang=jamParts[1]; break;
            case 3: masuk=jamParts[0]; ist1=jamParts[1]; pulang=jamParts[2]; break;
            case 4: masuk=jamParts[0]; ist1=jamParts[1]; kem1=jamParts[2]; pulang=jamParts[3]; break;
            case 5: masuk=jamParts[0]; ist1=jamParts[1]; kem1=jamParts[2]; ist2=jamParts[3]; pulang=jamParts[4]; break;
            default: masuk=jamParts[0]||''; ist1=jamParts[1]||''; kem1=jamParts[2]||''; ist2=jamParts[3]||''; kem2=jamParts[4]||''; pulang=jamParts[5]||'';
          }
          absensiData[foundKey]['hari_' + hariNum] = {
            nama: foundPromotor.namaAbsen, hari: hariNum,
            masuk, istirahat1: ist1, kembali1: kem1, istirahat2: ist2, kembali2: kem2, pulang,
            terlambat: '', bulan: bulanIni
          };
          hariCount++;
        }
      }
      if (promotorCount === 0) {
        el.innerHTML = `<div class="alert err">Tidak ada promotor cocok!<br>Nama di file: ${skipList.slice(0,10).join(', ')}</div>`;
        return;
      }
      el.innerHTML = `
        <div class="alert ok">Berhasil membaca ${promotorCount} promotor • ${hariCount} hari</div>
        ${skipList.length > 0 ? `<div class="alert warn">${skipList.length} nama finger TIDAK cocok:<br><b>${skipList.join(', ')}</b><br><small>Tambahkan di menu Master Promotor (field Nama Finger).</small></div>` : ''}
        <button class="btn-success btn-full" onclick="konfirmasiUploadFinger()">Konfirmasi Upload</button>
      `;
      window._fingerData = absensiData;
    } catch (err) { el.innerHTML = `<div class="alert err">${err.message}</div>`; }
  };
  reader.readAsArrayBuffer(file);
}

function handleFileMaster(e) {
  const file = e.target.files[0];
  if (!file) return;
  const el = document.getElementById('masterInfo');
  el.innerHTML = '<div class="alert warn"><span class="spinner spinner-dark"></span> Membaca...</div>';
  const reader = new FileReader();
  reader.onload = async (evt) => {
    try {
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const result = { master: {}, penjualan: [], absensi: {}, info: {} };

      const ms = wb.Sheets['MASTER_SALES'];
      if (ms) {
        const rows = XLSX.utils.sheet_to_json(ms, { header: 1, defval: '' });
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r[0]) continue;
          if (String(r[2]).trim().toUpperCase() !== 'YA') continue;
          if (String(r[5] || '').trim().toUpperCase() !== 'YA') continue;
          if (String(r[4] || '').trim().toUpperCase() !== 'USER') continue;
          const rawTarget = r[7];
          const targetUC = (rawTarget !== '' && rawTarget !== null && rawTarget !== undefined) ? Number(rawTarget) : 16;
          const ikutUC = String(r[6] || (targetUC === 0 ? 'TIDAK' : 'YA')).trim().toUpperCase();
          const namaAbsen = String(r[0]).trim();
          const key = sanitizeKey(namaAbsen);
          result.master[key] = {
            namaFinger: String(r[0]).trim(),
            namaSalesId: String(r[1]).trim(),
            namaAbsen: namaAbsen,
            email: '',
            role: 'PROMOTOR',
            tampilWeb: 'YA',
            aktif: 'YA',
            merk: String(r[8] || '').trim(),
            targetUC: targetUC,
            ikutUC: ikutUC
          };
        }
      }

      const mapSheet = wb.Sheets['MAPPING_NAMA'];
      if (mapSheet) {
        const rows = XLSX.utils.sheet_to_json(mapSheet, { header: 1, defval: '' });
        for (let i = 1; i < rows.length; i++) {
          const finger = String(rows[i][0] || '').trim();
          const absen = String(rows[i][1] || '').trim();
          if (!finger || !absen) continue;
          const key = sanitizeKey(absen);
          if (result.master[key]) {
            result.master[key].namaFinger = finger;
          }
        }
      }

      const pj = wb.Sheets['PENJUALAN'];
      if (pj) {
        const rows = XLSX.utils.sheet_to_json(pj, { header: 1, defval: '' });
        let hIdx = -1;
        for (let i = 0; i < rows.length; i++) {
          const a = String(rows[i][0] || '').trim().toLowerCase();
          const b = String(rows[i][1] || '').trim().toLowerCase();
          if (a === 'store' && b.includes('faktur')) { hIdx = i; break; }
        }
        if (hIdx !== -1) {
          const header = rows[hIdx].map(h => String(h || '').trim().toLowerCase());
          const cariIdx = (nama) => header.findIndex(h => h.includes(nama));
          const idx = {
            noFaktur: cariIdx('nomor faktur'), tanggal: cariIdx('tanggal faktur'),
            barcode: cariIdx('barcode'), namaBarang: cariIdx('nama barang'),
            qty: cariIdx('qty'), subtotal: cariIdx('subtotal'),
            namaSales: cariIdx('nama sales'), kategori: cariIdx('kategori'), merk: cariIdx('merk')
          };
          for (let i = hIdx + 1; i < rows.length; i++) {
            const r = rows[i];
            if (!r || !r[idx.noFaktur] || !r[idx.tanggal]) continue;
            const nb = String(r[idx.namaBarang] || '').trim().toUpperCase();
            if (['TOTAL','GRAND TOTAL','SUB TOTAL','JUMLAH','REKAP'].includes(nb)) continue;
            result.penjualan.push({
              noFaktur: String(r[idx.noFaktur]).trim(),
              tanggal: convertTanggalExcel(r[idx.tanggal]),
              barcode: String(r[idx.barcode] || '').trim(),
              namaBarang: String(r[idx.namaBarang] || '').trim(),
              qty: parseAngka(r[idx.qty]),
              subtotal: parseAngka(r[idx.subtotal]),
              namaSales: String(r[idx.namaSales] || '').trim(),
              kategori: String(r[idx.kategori] || '').trim().toUpperCase(),
              merk: String(r[idx.merk] || '').trim().toUpperCase()
            });
          }
        }
      }

      const ab = wb.Sheets['ABSENFINGER'];
      if (ab) {
        const rows = XLSX.utils.sheet_to_json(ab, { header: 1, defval: '' });
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r || !r[0]) continue;
          const namaAbsen = String(r[0]).trim();
          let hariNum = 0;
          const tglRaw = r[1];
          if (tglRaw !== undefined && tglRaw !== null && tglRaw !== '') hariNum = typeof tglRaw === 'number' ? Math.floor(tglRaw) : parseInt(String(tglRaw).trim(), 10) || 0;
          if (hariNum < 1 || hariNum > 31) continue;
          const key = sanitizeKey(namaAbsen);
          if (!result.absensi[key]) result.absensi[key] = {};
          if (result.absensi[key]['hari_' + hariNum]) continue;
          result.absensi[key]['hari_' + hariNum] = {
            nama: namaAbsen, hari: hariNum,
            masuk: convertJam(r[2]), istirahat1: convertJam(r[3]),
            kembali1: convertJam(r[4]), istirahat2: convertJam(r[5]),
            kembali2: convertJam(r[6]), pulang: convertJam(r[7]),
            terlambat: String(r[8] || '').trim().toUpperCase(),
            bulan: String(r[9] || '').trim()
          };
        }
      }

      const parseSheet = (sheet, cols) => {
        if (!sheet) return [];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
        const out = [];
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r[0]) continue;
          const obj = {};
          cols.forEach((c, idx) => { obj[c] = String(r[idx] || '').trim(); });
          out.push(obj);
        }
        return out;
      };
      result.info.promo = parseSheet(wb.Sheets['PROMO'], ['judul','periode','detail']);
      result.info.rules = parseSheet(wb.Sheets['RULES'], ['poin','deskripsi']);

      const totalAbsensi = Object.values(result.absensi).reduce((s, o) => s + Object.keys(o).length, 0);
      el.innerHTML = `
        <div class="alert ok">Siap upload:<br>• ${Object.keys(result.master).length} promotor<br>• ${result.penjualan.length} transaksi<br>• ${Object.keys(result.absensi).length} promotor absensi (${totalAbsensi} hari)</div>
        <button class="btn-success btn-full" onclick="konfirmasiUploadMaster()">Konfirmasi Upload</button>
      `;
      window._masterData = result;
    } catch (err) { el.innerHTML = `<div class="alert err">${err.message}</div>`; }
  };
  reader.readAsArrayBuffer(file);
}

async function konfirmasiUploadMaster() {
  const data = window._masterData;
  if (!data) return;
  const el = document.getElementById('masterInfo');
  el.innerHTML = '<div class="alert warn"><span class="spinner spinner-dark"></span> Uploading...</div>';
  try {
    const updates = {};
    Object.keys(data.master).forEach(k => { updates['users/master_promotor/' + k] = data.master[k]; });
    Object.keys(data.master).forEach(k => {
      const p = data.master[k];
      if (p.email && p.email.includes('@')) {
        const emailKey = p.email.toLowerCase().replace(/\./g, ',');
        updates['users/whitelist/' + emailKey] = { email: p.email.toLowerCase(), nama: p.namaAbsen, role: p.role, promotorKey: k };
      }
    });
    Object.keys(data.master).forEach(k => {
      const p = data.master[k];
      if (p.namaFinger && p.namaAbsen) {
        updates['users/mapping_nama/' + p.namaFinger.toUpperCase()] = p.namaAbsen;
      }
    });

    const snapAll = await window.dbGet(window.dbRef(window.db, 'penjualan/' + BULAN_INI + '/all'));
    const setExist = new Set();
    if (snapAll.exists()) Object.values(snapAll.val()).forEach(x => { if (x && x.noFaktur && x.barcode) setExist.add(x.noFaktur + '|' + x.barcode); });

    let cBaru = 0, cSkip = 0;
    const salesTidakDikenal = new Set();
    data.penjualan.forEach((item, idx) => {
      const k = item.noFaktur + '|' + item.barcode;
      if (setExist.has(k)) { cSkip++; return; }
      const txId = `t_${Date.now()}_${idx}_${Math.random().toString(36).substr(2,6)}`;
      updates[`penjualan/${BULAN_INI}/all/${txId}`] = item;
      const pk = cariPromotorKeyBySalesId(item.namaSales);
      if (pk) updates[`penjualan/${BULAN_INI}/per_promotor/${pk}/${txId}`] = item;
      else salesTidakDikenal.add(item.namaSales);
      cBaru++;
    });

    Object.keys(data.absensi).forEach(k => { updates[`absensi/${BULAN_INI}/${k}`] = data.absensi[k]; });
    if (data.info.promo.length) updates['info/promo'] = data.info.promo;
    if (data.info.rules.length) updates['info/rules'] = data.info.rules;

    await window.dbUpdate(window.dbRef(window.db), updates);
    el.innerHTML = `<div class="alert ok">Upload Berhasil!<br>• ${Object.keys(data.master).length} promotor<br>• ${cBaru} transaksi baru (${cSkip} duplikat)</div>
      ${salesTidakDikenal.size > 0 ? `<div class="alert warn">Nama sales tidak dikenali: <b>${[...salesTidakDikenal].join(', ')}</b><br><small>Tambahkan di Master Promotor (field Nama Sales ID).</small></div>` : ''}
      <button class="btn-soft btn-full" onclick="location.reload()">Refresh</button>`;
    window._masterData = null;
  } catch (err) { el.innerHTML = `<div class="alert err">${err.message}</div>`; }
}

  const keyLama = document.getElementById('f_keyLama').value;
  const namaFinger = document.getElementById('f_namaFinger').value.trim();
  const namaSalesId = document.getElementById('f_namaSalesId').value.trim();
  const namaAbsen = document.getElementById('f_namaAbsen').value.trim();
  const email = document.getElementById('f_email').value.trim().toLowerCase();
  const role = document.getElementById('f_role').value;
  const tampilWeb = document.getElementById('f_tampilWeb').value;
  const aktif = document.getElementById('f_aktif').value;
  const merk = document.getElementById('f_merk').value.trim();
  const targetUC = Number(document.getElementById('f_targetUC').value) || 0;
  const ikutUC = document.getElementById('f_ikutUC').value;

  if (!namaFinger || !namaSalesId || !namaAbsen) { msg.innerHTML = '<div class="alert err">Nama Finger, Nama Sales ID, dan Nama Tampil Web wajib diisi!</div>'; return; }
  if (email && !email.includes('@')) { msg.innerHTML = '<div class="alert err">Email tidak valid!</div>'; return; }

  const keyBaru = sanitizeKey(namaAbsen);
  if (keyLama && keyLama !== keyBaru) {
    if (allMaster[keyBaru]) { msg.innerHTML = `<div class="alert err">Nama Tampil "${namaAbsen}" sudah dipakai promotor lain! Pakai nama lain.</div>`; return; }
  } else if (!keyLama) {
    if (allMaster[keyBaru]) { msg.innerHTML = `<div class="alert err">Nama Tampil "${namaAbsen}" sudah ada! Pakai nama lain atau edit yang sudah ada.</div>`; return; }
  }

  const dataBaru = { namaFinger, namaSalesId, namaAbsen, email, role, tampilWeb, aktif, merk, targetUC, ikutUC };
  const updates = {};

  updates['users/master_promotor/' + keyBaru] = dataBaru;

  if (email) {
    const emailKey = email.replace(/\./g, ',');
    updates['users/whitelist/' + emailKey] = { email, nama: namaAbsen, role, promotorKey: keyBaru };
  }

  updates['users/mapping_nama/' + namaFinger.toUpperCase()] = namaAbsen;

  if (keyLama && keyLama !== keyBaru) {
    updates['users/master_promotor/' + keyLama] = null;
    const oldP = allMaster[keyLama];
    if (oldP && oldP.email) {
      const oldEmailKey = oldP.email.toLowerCase().replace(/\./g, ',');
      if (oldEmailKey !== (email ? email.replace(/\./g, ',') : '')) updates['users/whitelist/' + oldEmailKey] = null;
    }
    if (oldP && oldP.namaFinger && oldP.namaFinger.toUpperCase() !== namaFinger.toUpperCase()) {
      updates['users/mapping_nama/' + oldP.namaFinger.toUpperCase()] = null;
    }
  }

  if (keyLama && allMaster[keyLama] && allMaster[keyLama].email) {
    const oldEmail = allMaster[keyLama].email.toLowerCase();
    const newEmail = email;
    if (oldEmail !== newEmail) {
      updates['users/whitelist/' + oldEmail.replace(/\./g, ',')] = null;
    }
  }

  try {
    await window.dbUpdate(window.dbRef(window.db), updates);
    if (keyLama && keyLama !== keyBaru) {
      await migrasiKey(keyLama, keyBaru);
    }
    msg.innerHTML = '<div class="alert ok">Tersimpan!</div>';
    setTimeout(() => { tutupFormMaster(); }, 800);
  } catch (err) { msg.innerHTML = `<div class="alert err">${err.message}</div>`; }
}

async function migrasiKey(keyLama, keyBaru) {
  try {
    const updates = {};
    const snapAbs = await window.dbGet(window.dbRef(window.db, 'absensi/' + BULAN_INI + '/' + keyLama));
    if (snapAbs.exists()) {
      Object.keys(snapAbs.val()).forEach(hk => { updates[`absensi/${BULAN_INI}/${keyBaru}/${hk}`] = snapAbs.val()[hk]; });
      updates[`absensi/${BULAN_INI}/${keyLama}`] = null;
    }
    const snapPj = await window.dbGet(window.dbRef(window.db, 'penjualan/' + BULAN_INI + '/per_promotor/' + keyLama));
    if (snapPj.exists()) {
      Object.keys(snapPj.val()).forEach(txId => { updates[`penjualan/${BULAN_INI}/per_promotor/${keyBaru}/${txId}`] = snapPj.val()[txId]; });
      updates[`penjualan/${BULAN_INI}/per_promotor/${keyLama}`] = null;
    }
    if (Object.keys(updates).length > 0) await window.dbUpdate(window.dbRef(window.db), updates);
  } catch (err) { console.error('Migrasi key gagal:', err); }
}

async function migrasiDataLama() {
  tampilkanKonfirmasi('Migrasi Data Lama?', 'Gabungkan users/promotor + users/whitelist + users/mapping_nama → users/master_promotor. Data lama akan dihapus setelah sukses.', async () => {
    try {
      const updates = {};
      const [snapP, snapW, snapM] = await Promise.all([
        window.dbGet(window.dbRef(window.db, 'users/promotor')),
        window.dbGet(window.dbRef(window.db, 'users/whitelist')),
        window.dbGet(window.dbRef(window.db, 'users/mapping_nama'))
      ]);
      const promotorLama = snapP.exists() ? snapP.val() : {};
      const whitelistLama = snapW.exists() ? snapW.val() : {};
      const mappingLama = snapM.exists() ? snapM.val() : {};

      const byAbsen = {};
      Object.keys(promotorLama).forEach(k => {
        const p = promotorLama[k];
        const na = String(p.namaAbsen || '').trim();
        if (!na) return;
        byAbsen[na] = {
          namaFinger: na,
          namaSalesId: p.namaSales || '',
          namaAbsen: na,
          email: '',
          role: 'PROMOTOR',
          tampilWeb: 'YA',
          aktif: 'YA',
          merk: p.merk || '',
          targetUC: p.targetUC !== undefined ? p.targetUC : 16,
          ikutUC: p.ikutUC || 'YA'
        };
      });

      Object.keys(mappingLama).forEach(finger => {
        const absen = String(mappingLama[finger] || '').trim();
        if (byAbsen[absen]) byAbsen[absen].namaFinger = finger;
      });

      Object.keys(whitelistLama).forEach(emailKey => {
        const w = whitelistLama[emailKey];
        const na = String(w.nama || '').trim();
        if (byAbsen[na]) {
          byAbsen[na].email = w.email || '';
          byAbsen[na].role = w.role || 'PROMOTOR';
        }
      });

      Object.keys(byAbsen).forEach(na => {
        const key = sanitizeKey(na);
        updates['users/master_promotor/' + key] = byAbsen[na];
      });

      await window.dbUpdate(window.dbRef(window.db), updates);
      tampilkanNotif('Berhasil', `Migrasi selesai: ${Object.keys(byAbsen).length} promotor.`, 'success');
      renderTab();
    } catch (err) { tampilkanNotif('Gagal', err.message, 'danger'); }
  }, 'warning');
}

async function simpanAdmin() {
  const msg = document.getElementById('formMsg');
  const keyLama = document.getElementById('f_keyLama').value;
  const namaAbsen = document.getElementById('f_namaAbsen').value.trim();
  const email = document.getElementById('f_email').value.trim().toLowerCase();

  if (!namaAbsen) { msg.innerHTML = '<div class="alert err">Nama Tampil wajib diisi!</div>'; return; }
  if (!email) { msg.innerHTML = '<div class="alert err">Email wajib diisi untuk admin!</div>'; return; }
  if (!email.includes('@')) { msg.innerHTML = '<div class="alert err">Email tidak valid!</div>'; return; }

  const keyBaru = sanitizeKey(namaAbsen);
  if (keyLama && keyLama !== keyBaru && allMaster[keyBaru]) {
    msg.innerHTML = `<div class="alert err">Nama "${namaAbsen}" sudah dipakai! Pakai nama lain.</div>`; return;
  }
  if (!keyLama && allMaster[keyBaru]) {
    msg.innerHTML = `<div class="alert err">Nama "${namaAbsen}" sudah ada! Pakai nama lain atau edit yang sudah ada.</div>`; return;
  }

  const dataBaru = {
    namaFinger: '', namaSalesId: '', namaAbsen, email,
    role: 'ADMIN', tampilWeb: 'TIDAK', aktif: 'YA',
    merk: '', targetUC: 0, ikutUC: 'TIDAK'
  };
  const updates = {};
  updates['users/master_promotor/' + keyBaru] = dataBaru;
  const emailKey = email.replace(/\./g, ',');
  updates['users/whitelist/' + emailKey] = { email, nama: namaAbsen, role: 'ADMIN', promotorKey: keyBaru };

  if (keyLama && keyLama !== keyBaru) {
    updates['users/master_promotor/' + keyLama] = null;
    const oldP = allMaster[keyLama];
    if (oldP && oldP.email) updates['users/whitelist/' + oldP.email.toLowerCase().replace(/\./g, ',')] = null;
  }
  if (keyLama && allMaster[keyLama] && allMaster[keyLama].email) {
    const oldEmail = allMaster[keyLama].email.toLowerCase();
    if (oldEmail !== email) updates['users/whitelist/' + oldEmail.replace(/\./g, ',')] = null;
  }

  try {
    await window.dbUpdate(window.dbRef(window.db), updates);
    msg.innerHTML = '<div class="alert ok">Admin tersimpan!</div>';
    setTimeout(() => { tutupFormMaster(); }, 800);
  } catch (err) { msg.innerHTML = `<div class="alert err">${err.message}</div>`; }

async function hapusAdmin(key, nama) {
  if (window.adminUser && window.adminUser.email) {
    const myEmailKey = window.adminUser.email.toLowerCase().replace(/\./g, ',');
    const snap = await window.dbGet(window.dbRef(window.db, 'users/whitelist/' + myEmailKey));
    if (snap.exists() && snap.val().promotorKey === key) {
      tampilkanNotif('Tidak Bisa', 'Anda tidak bisa menghapus akun admin Anda sendiri!', 'danger');
      return;
    }
  }
  const totalAdmin = Object.values(allMaster).filter(p => p.role === 'ADMIN' && p.aktif === 'YA').length;
  if (totalAdmin <= 1) {
    tampilkanNotif('Tidak Bisa', 'Minimal harus ada 1 admin aktif!', 'danger');
    return;
  }
  tampilkanKonfirmasi('Hapus Admin?', `Yakin hapus admin "${nama}"? Admin ini tidak akan bisa login lagi.`, async () => {
    try {
      const updates = {};
      const p = allMaster[key];
      updates['users/master_promotor/' + key] = null;
      if (p && p.email) updates['users/whitelist/' + p.email.toLowerCase().replace(/\./g, ',')] = null;
      await window.dbUpdate(window.dbRef(window.db), updates);
      tampilkanNotif('Berhasil', 'Admin dihapus.', 'success');
    } catch (err) { tampilkanNotif('Gagal', err.message, 'danger'); }
  }, 'danger');
}

function renderTerlambat() {
  const list = Object.keys(allMaster).map(k => ({ key: k, ...allMaster[k] }))
    .filter(p => p.tampilWeb === 'YA' && p.aktif === 'YA')
    .sort((a,b) => (a.namaAbsen || '').localeCompare(b.namaAbsen || ''));
  const hariTerpilih = window._hariTerlambat || new Date().getDate();
  let html = `
    <div class="card">
      <h3>Kelola Terlambat — ${getNamaBulanIndo(BULAN_INI)}</h3>
      <p>Pilih tanggal, lalu klik Tandai.</p>
      <input type="number" id="tglTerlambat" min="1" max="31" value="${hariTerpilih}" style="width:120px; font-size:18px; text-align:center; font-weight:800; padding:12px;" onchange="window._hariTerlambat=this.value; renderTab()">
    </div>
    <div class="card"><h3>Daftar Promotor</h3>`;
  list.forEach(p => {
    const absensiP = allAbsensi[p.key] || {};
    const h = absensiP['hari_' + hariTerpilih];
    const adaFinger = h && h.masuk && String(h.masuk).trim() !== '' && h.masuk !== '-';
    const sudahTerlambat = adaFinger && String(h.terlambat || '').toUpperCase() === 'YA';
    let totalBulanIni = 0;
    Object.values(absensiP).forEach(a => { if (a && a.masuk && String(a.terlambat||'').toUpperCase() === 'YA') totalBulanIni++; });
    html += `
      <div class="list-item ${sudahTerlambat ? 'late-item' : ''}">
        <div class="kiri">
          <div class="nama">${p.namaAbsen}</div>
          <div class="detail">${p.namaSalesId || '-'} • ${p.merk || '-'}
            ${!adaFinger ? '<span style="color:#94a3b8;"> • Belum ada finger</span>' : ''}
            ${totalBulanIni > 0 ? `<span style="color:#d97706; font-weight:700;"> • ${totalBulanIni}x terlambat</span>` : ''}
          </div>
        </div>
        <div class="kanan">
          ${sudahTerlambat ? '<span class="late-marker">TERLAMBAT</span>' : ''}
          <button class="btn-warning btn-sm" onclick="bukaFormEditAbsensi('${p.key}', ${hariTerpilih})" style="margin-right: 4px;">Edit</button>
          ${adaFinger ? `<button class="${sudahTerlambat ? 'btn-danger' : 'btn-primary'} btn-sm" onclick="toggleTerlambat('${p.key}', ${hariTerpilih}, ${sudahTerlambat})">${sudahTerlambat ? 'Batal' : 'Tandai'}</button>` : `<button class="btn-soft btn-sm" disabled style="opacity:0.4;">-</button>`}
        </div>
      </div>`;
  });
  html += `</div>`;
  return html;
}

async function toggleTerlambat(promotorKey, hari, sudahTerlambat) {
  try {
    const path = `absensi/${BULAN_INI}/${promotorKey}/hari_${hari}`;
    const snap = await window.dbGet(window.dbRef(window.db, path));
    if (snap.exists()) await window.dbUpdate(window.dbRef(window.db, path), { terlambat: sudahTerlambat ? '' : 'YA' });
    renderTab();
  } catch (err) { tampilkanNotif('Gagal', err.message, 'danger'); }
}

    </div>`;
}
async function tambahPromo() {
  const judul = document.getElementById('promo_judul').value.trim();
  const periode = document.getElementById('promo_periode').value.trim();
  const d1 = document.getElementById('promo_detail_1').value.trim();
  const d2 = document.getElementById('promo_detail_2').value.trim();
  const d3 = document.getElementById('promo_detail_3').value.trim();
  const msg = document.getElementById('promoMsg');
  if (!judul) { msg.innerHTML = '<div class="alert err">Judul wajib!</div>'; return; }
  try {
    const snap = await window.dbGet(window.dbRef(window.db, 'info/promo'));
    let arr = snap.exists() ? snap.val() : [];
    if (!Array.isArray(arr)) arr = Object.values(arr);
    arr.push({ judul, periode, detail: [d1,d2,d3].filter(Boolean).join('\n') });
    await window.dbSet(window.dbRef(window.db, 'info/promo'), arr);
    msg.innerHTML = '<div class="alert ok">Ditambahkan!</div>';
    setTimeout(() => msg.innerHTML = '', 3000);
  } catch (err) { msg.innerHTML = `<div class="alert err">${err.message}</div>`; }
}
async function hapusPromo(index) {
  tampilkanKonfirmasi('Hapus Promo?', 'Yakin?', async () => {
    try {
      const snap = await window.dbGet(window.dbRef(window.db, 'info/promo'));
      let arr = snap.exists() ? snap.val() : [];
      if (!Array.isArray(arr)) arr = Object.values(arr);
      arr.splice(index, 1);
      await window.dbSet(window.dbRef(window.db, 'info/promo'), arr);
      tampilkanNotif('Berhasil', 'Promo dihapus.', 'success');
      renderTab();
    } catch (err) { tampilkanNotif('Gagal', err.message, 'danger'); }
  }, 'danger');
}
let _sopImageData = null;
function pilihFileSOP(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 500 * 1024) { tampilkanNotif('File Besar', 'Maks 500KB.', 'danger'); return; }
  const reader = new FileReader();
  reader.onload = (evt) => {
    _sopImageData = evt.target.result;
    document.getElementById('sop_file_label').innerHTML = `<strong>${file.name}</strong><br><small>${Math.round(file.size/1024)} KB</small>`;
  };
  reader.readAsDataURL(file);
}
async function tambahSOP() {
  const judul = document.getElementById('sop_judul').value.trim();
  const msg = document.getElementById('sopMsg');
  if (!judul) { msg.innerHTML = '<div class="alert err">Judul wajib!</div>'; return; }
  if (!_sopImageData) { msg.innerHTML = '<div class="alert err">Pilih gambar!</div>'; return; }
  try {
    const snap = await window.dbGet(window.dbRef(window.db, 'info/rules'));
    let arr = snap.exists() ? snap.val() : [];
    if (!Array.isArray(arr)) arr = Object.values(arr);
    arr.push({ poin: judul, deskripsi: '', gambar: _sopImageData });
    await window.dbSet(window.dbRef(window.db, 'info/rules'), arr);
    msg.innerHTML = '<div class="alert ok">Ditambahkan!</div>';
    _sopImageData = null;
    setTimeout(() => msg.innerHTML = '', 3000);
  } catch (err) { msg.innerHTML = `<div class="alert err">${err.message}</div>`; }
}
async function hapusSOP(index) {
  tampilkanKonfirmasi('Hapus SOP?', 'Yakin?', async () => {
    try {
      const snap = await window.dbGet(window.dbRef(window.db, 'info/rules'));
      let arr = snap.exists() ? snap.val() : [];
      if (!Array.isArray(arr)) arr = Object.values(arr);
      arr.splice(index, 1);
      await window.dbSet(window.dbRef(window.db, 'info/rules'), arr);
      tampilkanNotif('Berhasil', 'SOP dihapus.', 'success');
      renderTab();
    } catch (err) { tampilkanNotif('Gagal', err.message, 'danger'); }
  }, 'danger');
}

/* ===== DANGER ZONE ===== */
function renderDanger() {
  return `
    <div class="card">
      <h3 style="color:var(--danger);"><svg viewBox="0 0 24 24" style="stroke:var(--danger);"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Danger Zone</h3>
      <p>Hati-hati! Data yang dihapus tidak bisa dikembalikan.</p>
      <button class="btn-warning btn-full" style="margin-bottom:12px;" onclick="downloadExcelBulanIni()"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Download Data Bulan Ini (Excel)</button>
      <button class="btn-danger btn-full" style="margin-bottom:12px;" onclick="hapusPenjualanBulanIni()">Hapus Penjualan Bulan Ini</button>
      <button class="btn-danger btn-full" style="margin-bottom:12px;" onclick="hapusAbsensiBulanIni()">Hapus Absensi Bulan Ini</button>
      <button class="btn-danger btn-full" onclick="hapusSemua()">Hapus SEMUA Data</button>
    </div>
  `;
}
async function downloadExcelBulanIni() {
  const dataJual = Object.values(allPenjualan);
  const absenRows = [];
  Object.keys(allAbsensi).forEach(kp => {
    const p = allMaster[kp] || {};
    Object.keys(allAbsensi[kp]).forEach(hk => {
      const a = allAbsensi[kp][hk];
      if (a && typeof a === 'object') absenRows.push({ Promotor: p.namaAbsen || a.nama || '-', Hari: a.hari || '', Masuk: a.masuk || '', Pulang: a.pulang || '', Terlambat: a.terlambat || '' });
    });
  });
  if (dataJual.length === 0 && absenRows.length === 0) { tampilkanNotif('Kosong', 'Belum ada data.', 'warning'); return; }
  const wb = XLSX.utils.book_new();
  if (dataJual.length > 0) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dataJual), 'Penjualan');
  if (absenRows.length > 0) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(absenRows), 'Absensi');
  XLSX.writeFile(wb, `Data_UFO_${BULAN_INI}.xlsx`);
}
async function hapusPenjualanBulanIni() { tampilkanKonfirmasi('Hapus Penjualan?', 'Yakin?', async () => { await window.dbRemove(window.dbRef(window.db, 'penjualan/' + BULAN_INI)); tampilkanNotif('Berhasil', 'Dihapus.', 'success'); }, 'danger'); }
async function hapusAbsensiBulanIni() { tampilkanKonfirmasi('Hapus Absensi?', 'Yakin?', async () => { await window.dbRemove(window.dbRef(window.db, 'absensi/' + BULAN_INI)); tampilkanNotif('Berhasil', 'Dihapus.', 'success'); }, 'danger'); }
async function hapusSemua() {
  tampilkanKonfirmasi('HAPUS SEMUA?', 'Semua data dihapus permanen!', async () => {
    await window.dbRemove(window.dbRef(window.db, 'penjualan'));
    await window.dbRemove(window.dbRef(window.db, 'users'));
    await window.dbRemove(window.dbRef(window.db, 'info'));
    await window.dbRemove(window.dbRef(window.db, 'absensi'));
    await window.dbRemove(window.dbRef(window.db, 'config'));
    tampilkanNotif('Berhasil', 'Semua dihapus.', 'success');
  }, 'danger');
}

/* ===== CEK BULAN BARU ===== */
async function cekDanTawarkanResetBulan() {
  try {
    const snap = await window.dbGet(window.dbRef(window.db, 'config/lastResetBulan'));
    const lastReset = snap.exists() ? snap.val() : '';
    if (lastReset && lastReset !== BULAN_INI) {
      tampilkanModal('Bulan Baru!', `Bulan berganti dari ${getNamaBulanIndo(lastReset)} ke ${getNamaBulanIndo(BULAN_INI)}. Download dulu data bulan lama sebelum reset!`, {
        type: 'info',
        customActions: [
          { text: 'Download', class: 'modal-btn-ok-warning', onclick: `downloadBulanLama('${lastReset}')` },
          { text: 'Reset', class: 'modal-btn-ok-danger', onclick: `resetBulanLama('${lastReset}')` },
          { text: 'Nanti', class: 'modal-btn-cancel', onclick: 'tutupModal()' }
        ]
      });
    } else if (!lastReset) {
      await window.dbSet(window.dbRef(window.db, 'config/lastResetBulan'), BULAN_INI);
    }
  } catch (err) { console.error(err); }
}
async function downloadBulanLama(bulanLama) {
  try {
    const [snapJual, snapAbs] = await Promise.all([
      window.dbGet(window.dbRef(window.db, 'penjualan/' + bulanLama + '/all')),
      window.dbGet(window.dbRef(window.db, 'absensi/' + bulanLama))
    ]);
    const wb = XLSX.utils.book_new();
    if (snapJual.exists()) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(Object.values(snapJual.val())), 'Penjualan');
    if (snapAbs.exists()) {
      const absenRows = [];
      const absenVal = snapAbs.val();
      Object.keys(absenVal).forEach(kp => Object.keys(absenVal[kp]).forEach(hk => { absenRows.push({ Promotor: kp, ...absenVal[kp][hk] }); }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(absenRows), 'Absensi');
    }
    XLSX.writeFile(wb, `Backup_UFO_${bulanLama}.xlsx`);
  } catch (err) { tampilkanNotif('Gagal', err.message, 'danger'); }
}
async function resetBulanLama(bulanLama) {
  tampilkanKonfirmasi('Reset Bulan ' + getNamaBulanIndo(bulanLama) + '?', 'Data bulan lama dihapus permanen!', async () => {
    await window.dbRemove(window.dbRef(window.db, 'penjualan/' + bulanLama));
    await window.dbRemove(window.dbRef(window.db, 'absensi/' + bulanLama));
    await window.dbSet(window.dbRef(window.db, 'config/lastResetBulan'), BULAN_INI);
    tampilkanNotif('Berhasil', 'Bulan lama direset.', 'success');
  }, 'danger');
}
