  <script>
  document.addEventListener('contextmenu', event => event.preventDefault());
  document.onkeydown = function(e) {
    if (e.keyCode == 123) { return false; } // F12
    if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { return false; } // Ctrl+Shift+I
    if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) { return false; } // Ctrl+Shift+C
    if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { return false; } // Ctrl+Shift+J
    if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { return false; } // Ctrl+U
  }
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, get, update, remove, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCcBuaevlaemlP2mX87gGi2JwGR29Y05as",
  authDomain: "dashboardkebonsari.firebaseapp.com",
  databaseURL: "https://dashboardkebonsari-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "dashboardkebonsari",
  storageBucket: "dashboardkebonsari.firebasestorage.app",
  messagingSenderId: "68113369328",
  appId: "1:68113369328:web:200be7e778bdc9104b5a35"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

// Ekspos fungsi ke global agar bisa dipakai di script bawah
window.db = db; window.dbRef = ref; window.dbSet = set; window.dbGet = get;
window.dbUpdate = update; window.dbRemove = remove; window.dbOnValue = onValue;
window.dbPush = push;
window.firebaseAuth = auth;
window.firebaseSignInWithPopup = signInWithPopup;
window.firebaseGoogleAuthProvider = GoogleAuthProvider;
window.firebaseSignOut = signOut;

// Cek status login secara otomatis
onAuthStateChanged(auth, async (user) => {
  if (user && user.email) {
    const emailKey = user.email.replace(/\./g, ',');
    try {
      const snap = await get(ref(db, 'users/whitelist/' + emailKey));
      if (snap.exists() && snap.val().role === 'ADMIN') {
        window.adminUser = { 
          email: user.email, 
          nama: snap.val().nama || user.displayName || user.email 
        };
      } else {
        showToast('Akun Anda bukan Admin!', 'error');
        await signOut(auth);
      }
    } catch (err) {
      console.error(err);
    }
  } else {
    window.adminUser = null;
  }
  window.dispatchEvent(new Event('firebase-ready'));
});
</script>

<style>
:root {
  --bg: #f4f7f6; --card: #ffffff; --soft: #f8fafc;
  --text: #0f172a; --muted: #64748b; --border: #e2e8f0;
  --primary: #4f46e5; --primary-dark: #4338ca;
  --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
  --radius: 16px;
}
* { box-sizing: border-box; font-family: 'Inter', sans-serif !important; -webkit-font-smoothing: antialiased; }
body { margin: 0; padding: 24px; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,0.03) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,0.03) 0, transparent 50%); }
.container { width: 100%; max-width: 960px; background: var(--card); border-radius: 24px; padding: 32px; box-shadow: 0 20px 40px -10px rgba(0,0,0,0.08); min-height: 90vh; border: 1px solid rgba(255,255,255,0.5); backdrop-filter: blur(20px); }

/* HEADER */
.header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 24px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
.header-left { display: flex; align-items: center; gap: 16px; }
.header-logo { width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, var(--primary), #818cf8); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 16px -4px rgba(79, 70, 229, 0.4); }
.header-logo svg { width: 24px; height: 24px; stroke: white; stroke-width: 2.5; fill: none; }
.header-title h1 { margin: 0; font-size: 20px; font-weight: 800; color: var(--text); letter-spacing: -0.5px; }
.header-title p { margin: 4px 0 0; font-size: 13px; color: var(--muted); font-weight: 500; }
.header-right { display: flex; gap: 10px; align-items: center; }
.header-user { padding: 8px 16px; background: #ecfdf5; color: #065f46; border-radius: 99px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; border: 1px solid #a7f3d0; }
.header-user::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 8px #10b981; }
.badge-bulan { padding: 8px 16px; background: #eff6ff; color: #1e40af; border-radius: 99px; font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; border: 1px solid #bfdbfe; }

/* TABS */
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; background: var(--soft); padding: 8px; border-radius: 16px; border: 1px solid var(--border); }
.tab-btn { flex: 1; min-width: 100px; padding: 12px 10px; border-radius: 12px; background: transparent; border: none; color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; display: flex; flex-direction: column; align-items: center; gap: 6px; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
.tab-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2.2; fill: none; transition: all 0.25s; }
.tab-btn:hover { background: white; color: var(--primary); box-shadow: var(--shadow-sm); }
.tab-btn.active { background: white; color: var(--primary); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15); border: 1px solid rgba(79, 70, 229, 0.1); }
.tab-btn.active svg { stroke: var(--primary); transform: scale(1.1); }

/* CARDS & FORMS */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow-sm); transition: all 0.3s ease; }
.card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.card h3 { margin: 0 0 16px; font-size: 15px; font-weight: 800; color: var(--text); display: flex; align-items: center; gap: 10px; }
.card h3 svg { width: 20px; height: 20px; stroke: var(--primary); stroke-width: 2.5; fill: none; }
.card p { margin: 0 0 16px; font-size: 13px; color: var(--muted); line-height: 1.6; }

label { display: block; font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
input, select, textarea { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--soft); font-size: 14px; font-weight: 600; color: var(--text); outline: none; transition: all 0.2s; }
textarea { resize: vertical; font-family: 'Inter', sans-serif !important; }
input:focus, select:focus, textarea:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }

/* BUTTONS */
button { padding: 12px 20px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); display: inline-flex; justify-content: center; align-items: center; gap: 8px; }
button svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.5; fill: none; }
button:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
button:active { transform: translateY(0); }
.btn-primary { background: linear-gradient(135deg, var(--primary), #6366f1); color: white; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25); }
.btn-primary:hover { background: linear-gradient(135deg, var(--primary-dark), var(--primary)); box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35); }
.btn-success { background: linear-gradient(135deg, #10b981, #059669); color: white; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25); }
.btn-success:hover { box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35); }
.btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25); }
.btn-danger:hover { box-shadow: 0 8px 20px rgba(239, 68, 68, 0.35); }
.btn-warning { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25); }
.btn-soft { background: white; color: var(--text); border: 1px solid var(--border); }
.btn-soft:hover { background: var(--soft); border-color: #cbd5e1; }
.btn-sm { padding: 8px 14px; font-size: 11px; width: auto; border-radius: 8px; }
.btn-full { width: 100%; }

/* UPLOAD AREA */
.file-wrap { border: 2px dashed #cbd5e1; border-radius: var(--radius); padding: 32px 20px; text-align: center; cursor: pointer; background: var(--soft); transition: all 0.25s; position: relative; overflow: hidden; }
.file-wrap:hover { background: #eff6ff; border-color: var(--primary); }
.file-wrap svg { width: 48px; height: 48px; stroke: var(--primary); stroke-width: 1.5; fill: none; margin-bottom: 12px; }
.file-wrap p { margin: 0; font-size: 14px; color: var(--muted); font-weight: 600; }
.file-wrap strong { color: var(--primary); }
.file-wrap input { display: none; }

/* ALERTS */
.alert { padding: 14px 16px; border-radius: 12px; font-size: 13px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: flex-start; gap: 10px; line-height: 1.5; }
.alert.ok { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
.alert.err { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
.alert.warn { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }

.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
.spinner-dark { border: 2px solid rgba(0,0,0,0.1); border-top-color: var(--primary); }
@keyframes spin { to { transform: rotate(360deg); } }

/* LIST ITEMS */
.list-item { background: white; border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 16px; transition: all 0.2s; }
.list-item:hover { box-shadow: var(--shadow); border-color: #cbd5e1; transform: translateX(4px); }
.list-item .kiri { flex: 1; min-width: 0; }
.list-item .nama { font-size: 14px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
.list-item .detail { font-size: 12px; color: var(--muted); margin-top: 4px; font-weight: 500; line-height: 1.5; }
.list-item .kanan { display: flex; gap: 8px; flex-shrink: 0; align-items: center; }
.list-item.late-item { border-left: 4px solid var(--warning); background: #fffbeb; }

/* STATS */
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.stat-card { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 20px 16px; text-align: center; transition: all 0.3s; }
.stat-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-4px); border-color: #cbd5e1; }
.stat-card .label { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.stat-card .value { font-size: 24px; font-weight: 900; color: var(--text); }
.stat-card.full { grid-column: 1 / -1; background: linear-gradient(135deg, #f0fdf4, #dcfce7); border-color: #bbf7d0; }
.stat-card.success .value { color: #059669; }

.late-marker { background: #fef3c7; border: 1px solid #fcd34d; border-radius: 8px; padding: 4px 10px; font-size: 10px; font-weight: 800; color: #92400e; text-transform: uppercase; letter-spacing: 0.5px; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }

.welcome-card { background: linear-gradient(135deg, #1e293b, #0f172a); color: white; border-radius: var(--radius); padding: 28px; margin-bottom: 24px; position: relative; overflow: hidden; box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.5); }
.welcome-card::before { content: ''; position: absolute; top: -50px; right: -50px; width: 250px; height: 250px; background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%); border-radius: 50%; }
.welcome-card h2 { margin: 0 0 8px; font-size: 24px; font-weight: 800; position: relative; letter-spacing: -0.5px; }
.welcome-card p { margin: 0; font-size: 14px; opacity: 0.8; position: relative; color: #cbd5e1; }

#loginBox { max-width: 400px; margin: 40px auto; animation: fadeIn 0.5s ease-out; }
#loginBox .card { background: white; padding: 32px; border-radius: 24px; box-shadow: 0 20px 40px -10px rgba(0,0,0,0.1); }
#loginBox h3 { font-size: 20px; text-align: center; margin-bottom: 24px; justify-content: center; }

/* MODAL */
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 99999; opacity: 0; visibility: hidden; transition: all 0.3s ease; padding: 16px; }
.modal-overlay.active { opacity: 1; visibility: visible; }
.modal-box { background: white; border-radius: 24px; padding: 32px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); transform: scale(0.9) translateY(20px); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); border: 1px solid rgba(255,255,255,0.2); }
.modal-overlay.active .modal-box { transform: scale(1) translateY(0); }
.modal-icon { width: 72px; height: 72px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 20px; }
.modal-icon.warning { background: #fef3c7; color: #d97706; }
.modal-icon.success { background: #ecfdf5; color: #10b981; }
.modal-icon.danger { background: #fef2f2; color: #ef4444; }
.modal-icon.info { background: #eff6ff; color: #3b82f6; }
.modal-icon svg { width: 36px; height: 36px; stroke: currentColor; stroke-width: 2.5; fill: none; }
.modal-title { font-size: 20px; font-weight: 800; color: var(--text); margin-bottom: 12px; letter-spacing: -0.5px; }
.modal-desc { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 28px; white-space: pre-line; }
.modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-actions.single { grid-template-columns: 1fr; }
.modal-actions.three { grid-template-columns: 1fr; gap: 8px; }
.modal-btn { padding: 14px 20px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.2s; display: inline-flex; justify-content: center; align-items: center; gap: 8px; font-family: inherit; }
.modal-btn-cancel { background: var(--soft); color: var(--text); border: 1px solid var(--border); }
.modal-btn-cancel:hover { background: var(--border); }
.modal-btn-ok-primary { background: linear-gradient(135deg, var(--primary), #6366f1); color: white; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25); }
.modal-btn-ok-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25); }
.modal-btn-ok-success { background: linear-gradient(135deg, #10b981, #059669); color: white; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25); }
.modal-btn-ok-warning { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25); }

/* TOAST */
.custom-toast {
  position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-20px);
  background: rgba(15, 23, 42, 0.95); color: #ffffff; padding: 16px 24px; border-radius: 14px;
  font-size: 14px; font-weight: 600; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.1); z-index: 999999; opacity: 0; visibility: hidden;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); display: flex; align-items: center; gap: 12px;
  backdrop-filter: blur(10px); max-width: 90%;
}
.custom-toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
.custom-toast svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2.5; fill: none; }

.hidden { display: none !important; }
.sop-preview { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 768px) {
  body { padding: 12px; }
  .container { padding: 20px; border-radius: 20px; }
  .header { flex-direction: column; align-items: flex-start; gap: 16px; }
  .header-right { width: 100%; justify-content: space-between; flex-wrap: wrap; }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tab-btn { padding: 12px 8px; font-size: 11px; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .list-item { flex-direction: column; align-items: stretch; gap: 12px; }
  .list-item .kanan { justify-content: flex-end; }
  .modal-actions.three { grid-template-columns: 1fr; }
}
</style>
</head>

function showToast(pesan, tipe = 'info') {
  const oldToast = document.querySelector('.custom-toast');

  const toast = document.createElement('div');
  toast.className = 'custom-toast';
  let icon = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>';

  else if (tipe === 'error') icon = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
  toast.innerHTML = `${icon} <span>${pesan}</span>`;
  document.body.appendChild(toast);
  setTimeout(() => toast.classList.add('show'), 10);
  setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3500);
}
window.showToast = showToast;

let _modalCallback = null;
function tampilkanModal(title, desc, opts, onOk) {
  opts = opts || {};
  const type = opts.type || 'warning';
  const showCancel = opts.showCancel !== false;
  document.getElementById('modalTitle').innerText = title;
  document.getElementById('modalDesc').innerText = desc;
  const iconEl = document.getElementById('modalIcon');
  iconEl.className = 'modal-icon ' + type;
  let iconSvg = '';
  if (type === 'warning') iconSvg = '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>';
  else if (type === 'success') iconSvg = '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>';
  else if (type === 'danger') iconSvg = '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>';
  else iconSvg = '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>';
  iconEl.innerHTML = '<svg viewBox="0 0 24 24">' + iconSvg + '</svg>';
  const actionsEl = document.getElementById('modalActions');
  const btnClass = type === 'danger' ? 'modal-btn-ok-danger' : type === 'success' ? 'modal-btn-ok-success' : type === 'warning' ? 'modal-btn-ok-warning' : 'modal-btn-ok-primary';
  if (opts.customActions) {
    actionsEl.className = 'modal-actions ' + (opts.customActions.length === 3 ? 'three' : '');
    actionsEl.innerHTML = opts.customActions.map(a => `<button class="modal-btn ${a.class}" onclick="${a.onclick}">${a.text}</button>`).join('');
  } else if (showCancel) {
    actionsEl.className = 'modal-actions';
    actionsEl.innerHTML = `<button class="modal-btn modal-btn-cancel" onclick="tutupModal()">${opts.cancelText || 'Batal'}</button><button class="modal-btn ${btnClass}" onclick="konfirmasiModal()">${opts.okText || 'OK'}</button>`;
  } else {
    actionsEl.className = 'modal-actions single';
    actionsEl.innerHTML = `<button class="modal-btn ${btnClass}" onclick="tutupModal()">${opts.okText || 'OK'}</button>`;
  }
  _modalCallback = onOk || null;
  document.getElementById('modalPopup').classList.add('active');
}
function tutupModal() { document.getElementById('modalPopup').classList.remove('active'); _modalCallback = null; }
function konfirmasiModal() { const cb = _modalCallback; tutupModal(); if (cb) cb(); }

/* ===== HELPER ===== */
function convertTanggalExcel(val) {
  if (val === undefined || val === null || val === '') return '';
  if (typeof val === 'number' && val > 1 && val < 100000) {
    const epochMs = Date.UTC(1899, 11, 30);
    const ms = epochMs + val * 24 * 60 * 60 * 1000;
    const d = new Date(ms);
    return String(d.getUTCDate()).padStart(2, '0') + '/' + String(d.getUTCMonth() + 1).padStart(2, '0') + '/' + d.getUTCFullYear();
  }
  const str = String(val).trim();
  if (!str) return '';
  if (/^\d{5}$/.test(str)) {
    const num = parseInt(str);
    const epochMs = Date.UTC(1899, 11, 30);
    const ms = epochMs + num * 24 * 60 * 60 * 1000;
    const d = new Date(ms);
    return String(d.getUTCDate()).padStart(2, '0') + '/' + String(d.getUTCMonth() + 1).padStart(2, '0') + '/' + d.getUTCFullYear();
  }
  if (/^\d{4}-\d{2}-\d{2}/.test(str)) {
    const p = str.split(' ')[0].split('-');
    return `${p[2]}/${p[1]}/${p[0]}`;
  }
  if (/^\d{1,2}\/\d{1,2}\/\d{4}/.test(str)) {
    const parts = str.split(' ')[0].split('/');
    return `${String(parts[1]).padStart(2, '0')}/${String(parts[0]).padStart(2, '0')}/${parts[2]}`;
  }
  return str;
}

function convertJam(val) {
  if (val === undefined || val === null || val === '') return '';
  if (typeof val === 'number') {
    if (val === 0 || isNaN(val)) return '';
    const totalMenit = Math.round(val * 24 * 60);
    return String(Math.floor(totalMenit / 60) % 24).padStart(2, '0') + ':' + String(totalMenit % 60).padStart(2, '0');
  }
  const str = String(val).trim();
  if (!str) return '';
  if (/^\d*\.?\d+$/.test(str)) {
    const num = parseFloat(str);
    if (isNaN(num) || num === 0) return '';
    if (num < 1) {
      const totalMenit = Math.round(num * 24 * 60);
      return String(Math.floor(totalMenit / 60) % 24).padStart(2, '0') + ':' + String(totalMenit % 60).padStart(2, '0');
    }
    const jam = Math.floor(num);
    return String(jam).padStart(2, '0') + ':' + String(Math.round((num - jam) * 60)).padStart(2, '0');
  }
  return str;
}

function sanitizeKey(nama) {
  return String(nama || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '_').replace(/_+/g, '_');
}

function handleFileFinger(e) {
  const file = e.target.files[0];
  if (!file) return;
  const el = document.getElementById('fingerInfo');
  el.innerHTML = '<div class="alert warn"><span class="spinner spinner-dark"></span> Membaca...</div>';
  const reader = new FileReader();
  reader.onload = async (evt) => {
    try {
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const sheetName = wb.SheetNames.find(n => n.toLowerCase().includes('punch') || n.toLowerCase().includes('raw')) || wb.SheetNames[0];
      const sheet = wb.Sheets[sheetName];
      if (!sheet) { el.innerHTML = '<div class="alert err">❌ Sheet tidak ditemukan!</div>'; return; }

      el.innerHTML = '<div class="alert warn"><span class="spinner spinner-dark"></span> Memuat Mapping Nama...</div>';
      const snapMapping = await window.dbGet(window.dbRef(window.db, 'data/mappingNama'));
      const mappingNama = snapMapping.exists() ? snapMapping.val() : {};

      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      const absensiData = {};
      let promotorCount = 0, hariCount = 0;
      let skipList = [];
      const bulanIni = getNamaBulanIndo(BULAN_INI);

      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        if (!row || !row[0]) continue;
        const m = String(row[0]).match(/Nama:(\S+)/);
        if (!m) continue;
        
        let namaFinger = m[1].trim();
        let namaAbsenTarget = namaFinger.toUpperCase();
        if (mappingNama[namaFinger.toUpperCase()]) {
          namaAbsenTarget = mappingNama[namaFinger.toUpperCase()];
        }

        const cleanKey = sanitizeKey(namaAbsenTarget);
        let foundKey = null, foundPromotor = null;
        
        if (allPromotor[cleanKey]) { 
          foundKey = cleanKey; 
          foundPromotor = allPromotor[cleanKey]; 
        } else {
          for (const k of Object.keys(allPromotor)) {
            const p = allPromotor[k];
            const uFinger = String(p.namaFinger || p.namaAbsen || '').toUpperCase();
            const uAbsen  = String(p.namaAbsen  || '').toUpperCase();
            const uSales  = String(p.namaSales  || '').toUpperCase();
            
            if (
              uFinger === namaAbsenTarget || 
              uAbsen === namaAbsenTarget || 
              uSales === namaAbsenTarget ||
              (uFinger.length > 2 && (namaAbsenTarget.includes(uFinger) || uFinger.includes(namaAbsenTarget)))
            ) {
              foundKey = k; 
              foundPromotor = p; 
              break;
            }
          }
        }
        
        if (!foundKey) { 
          if (skipList.indexOf(namaFinger) === -1) skipList.push(namaFinger); 
          continue; 
        }
        
        const dateRow = rows[i + 1], jamRow = rows[i + 2];
        if (!dateRow || !jamRow) continue;
        if (!absensiData[foundKey]) absensiData[foundKey] = {};
        promotorCount++;
        
        for (let col = 1; col < Math.max(dateRow.length, jamRow.length); col++) {
          const hariNum = parseInt(dateRow[col]) || 0;
          const jamStr = String(jamRow[col] || '').trim();
          if (hariNum < 1 || hariNum > 31 || !jamStr) continue;
          const jamParts = jamStr.split(/\s+/).filter(j => j.includes(':'));
          let masuk='', ist1='', kem1='', ist2='', kem2='', pulang='';
          switch(jamParts.length) {
            case 1: masuk=jamParts[0]; break;
            case 2: masuk=jamParts[0]; pulang=jamParts[1]; break;
            case 3: masuk=jamParts[0]; ist1=jamParts[1]; pulang=jamParts[2]; break;
            case 4: masuk=jamParts[0]; ist1=jamParts[1]; kem1=jamParts[2]; pulang=jamParts[3]; break;
            case 5: masuk=jamParts[0]; ist1=jamParts[1]; kem1=jamParts[2]; ist2=jamParts[3]; pulang=jamParts[4]; break;
            default: masuk=jamParts[0]||''; ist1=jamParts[1]||''; kem1=jamParts[2]||''; ist2=jamParts[3]||''; kem2=jamParts[4]||''; pulang=jamParts[5]||'';
          }
          absensiData[foundKey]['hari_' + hariNum] = {
            nama: foundPromotor.namaAbsen, hari: hariNum,
            masuk, istirahat1: ist1, kembali1: kem1, istirahat2: ist2, kembali2: kem2, pulang,
            terlambat: '', bulan: bulanIni
          };
          hariCount++;
        }
      }
      
      if (promotorCount === 0) {
        el.innerHTML = `<div class="alert err">❌ Tidak ada promotor cocok!<br>Nama di file: ${skipList.slice(0,5).join(', ')}</div>`;
        return;
      }
      el.innerHTML = `
        <div class="alert ok">✅ ${promotorCount} promotor • ${hariCount} hari
        ${skipList.length > 0 ? `<br><small>⚠️ ${skipList.length} tidak cocok (${skipList.slice(0,3).join(', ')}...)</small>` : ''}</div>

      `;
      window._fingerData = absensiData;
    } catch (err) { el.innerHTML = `<div class="alert err">❌ ${err.message}</div>`; }
  };
  reader.readAsArrayBuffer(file);
}

function handleFileMaster(e) {
  const file = e.target.files[0];
  if (!file) return;
  const el = document.getElementById('masterInfo');
  el.innerHTML = '<div class="alert warn"><span class="spinner spinner-dark"></span> Membaca...</div>';
  const reader = new FileReader();
  reader.onload = async (evt) => {
    try {
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const result = { promotor: [], penjualan: [], absensi: {}, info: {} };
      const ms = wb.Sheets['MASTER_SALES'];
      if (ms) {
        const rows = XLSX.utils.sheet_to_json(ms, { header: 1, defval: '' });
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r[0]) continue;
          if (String(r[2]).trim().toUpperCase() !== 'YA') continue;
          if (String(r[5] || '').trim().toUpperCase() !== 'YA') continue;
          if (String(r[4] || 'USER').trim().toUpperCase() !== 'USER') continue;
          result.promotor.push({
            namaAbsen: String(r[0]).trim(), 
            namaFinger: String(r[9] || r[0]).trim(),
            namaSales: String(r[1]).trim(),
            pin: String(r[3]).trim().replace(/\.0$/, ''),
            ikutUC: String(r[6] || 'YA').trim().toUpperCase(),
            targetUC: Number(r[7]) || 16, merk: String(r[8] || '').trim(), aktif: true
          });
        }
      }
      const pj = wb.Sheets['PENJUALAN'];
      if (pj) {
        const rows = XLSX.utils.sheet_to_json(pj, { header: 1, defval: '' });
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r[0] || !r[1]) continue;
          if (String(r[5]).trim().toUpperCase() === 'TOTAL') continue;
          result.penjualan.push({
            noFaktur: String(r[1]).trim(), tanggal: convertTanggalExcel(r[2]),
            barcode: String(r[3]).trim(), namaBarang: String(r[5]).trim(),
            qty: Number(r[6]) || 0, subtotal: Number(r[10]) || 0,
            namaSales: String(r[15]).trim(),
            kategori: String(r[17]).trim().toUpperCase(),
            merk: String(r[18]).trim().toUpperCase()
          });
        }
      }
      const ab = wb.Sheets['ABSENFINGER'];
      if (ab) {
        const rows = XLSX.utils.sheet_to_json(ab, { header: 1, defval: '' });
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r || !r[0] || String(r[0]).trim() === '') continue;
          const namaAbsen = String(r[0]).trim();
          let hariNum = 0;
          const tglRaw = r[1];
          if (tglRaw !== undefined && tglRaw !== null && tglRaw !== '') {
            hariNum = typeof tglRaw === 'number' ? Math.floor(tglRaw) : parseInt(String(tglRaw).trim(), 10) || 0;
          }
          if (hariNum < 1 || hariNum > 31) continue;
          const cleanKey = sanitizeKey(namaAbsen);
          if (!result.absensi[cleanKey]) result.absensi[cleanKey] = {};
          if (result.absensi[cleanKey]['hari_' + hariNum]) continue;
          result.absensi[cleanKey]['hari_' + hariNum] = {
            nama: namaAbsen, hari: hariNum,
            masuk: convertJam(r[2]), istirahat1: convertJam(r[3]),
            kembali1: convertJam(r[4]), istirahat2: convertJam(r[5]),
            kembali2: convertJam(r[6]), pulang: convertJam(r[7]),
            terlambat: String(r[8] || '').trim().toUpperCase(),
            bulan: String(r[9] || '').trim()
          };
        }
      }
      const parseSheet = (sheet, cols) => {
        if (!sheet) return [];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
        const out = [];
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r[0]) continue;
          const obj = {};
          cols.forEach((c, idx) => { obj[c] = String(r[idx] || '').trim(); });
          out.push(obj);
        }
        return out;
      };
      result.info.promo = parseSheet(wb.Sheets['PROMO'], ['judul', 'periode', 'detail']);
      result.info.rules = parseSheet(wb.Sheets['RULES'], ['poin', 'deskripsi']);
      const totalAbsensi = Object.values(result.absensi).reduce((s, o) => s + Object.keys(o).length, 0);
      el.innerHTML = `
        <div class="alert ok">✅ Siap upload:<br>• ${result.promotor.length} promotor<br>• ${result.penjualan.length} transaksi<br>• ${Object.keys(result.absensi).length} promotor absensi (${totalAbsensi} hari)</div>
        <button class="btn-success btn-full" onclick="konfirmasiUploadMaster()">Konfirmasi Upload</button>
      `;
      window._masterData = result;
    } catch (err) { el.innerHTML = `<div class="alert err">❌ ${err.message}</div>`; }
  };
  reader.readAsArrayBuffer(file);
}

async function konfirmasiUploadMaster() {
  const data = window._masterData;
  if (!data) return;
  const el = document.getElementById('masterInfo');
  el.innerHTML = '<div class="alert warn"><span class="spinner spinner-dark"></span> Uploading...</div>';
  try {
    const updates = {};
    data.promotor.forEach(p => { updates['users/promotor/' + sanitizeKey(p.namaAbsen)] = p; });

    const snapAll = await window.dbGet(window.dbRef(window.db, 'penjualan/' + BULAN_INI + '/all'));
    const setExist = new Set();
    if (snapAll.exists()) {
      Object.values(snapAll.val()).forEach(x => { if (x && x.noFaktur && x.barcode) setExist.add(x.noFaktur + '|' + x.barcode); });
    }

    const snapRoot = await window.dbGet(window.dbRef(window.db, 'penjualan/' + BULAN_INI));
    if (snapRoot.exists()) {
      const rootVal = snapRoot.val();
      Object.keys(rootVal).forEach(k => {
        if (k === 'all' || k === 'per_promotor') return;
        const item = rootVal[k];
        if (item && typeof item === 'object' && item.namaSales) {
          updates[`penjualan/${BULAN_INI}/all/${k}`] = item;
          setExist.add((item.noFaktur || '') + '|' + (item.barcode || ''));
        }
      });
    }

    let cBaru = 0, cSkip = 0, cTanpaPromotor = 0;
    data.penjualan.forEach((item, idx) => {
      const k = item.noFaktur + '|' + item.barcode;
      if (setExist.has(k)) { cSkip++; return; }
      const txId = `t_${Date.now()}_${idx}_${Math.random().toString(36).substr(2,6)}`;
      updates[`penjualan/${BULAN_INI}/all/${txId}`] = item;
      const pk = cariPromotorKey(item.namaSales);
      if (pk) {
        updates[`penjualan/${BULAN_INI}/per_promotor/${pk}/${txId}`] = item;
      } else {
        cTanpaPromotor++;
      }
      cBaru++;
    });

    Object.keys(data.absensi).forEach(k => {
      const absenP = data.absensi[k];
      let targetKey = k;
      let targetProm = data.promotor.find(p => sanitizeKey(p.namaFinger) === k || sanitizeKey(p.namaAbsen) === k);
      if (targetProm) targetKey = sanitizeKey(targetProm.namaAbsen);
      if (!updates[`absensi/${BULAN_INI}/${targetKey}`]) updates[`absensi/${BULAN_INI}/${targetKey}`] = {};
      Object.assign(updates[`absensi/${BULAN_INI}/${targetKey}`], absenP);
    });
    if (data.info.promo.length) updates['info/promo'] = data.info.promo;
    if (data.info.rules.length) updates['info/rules'] = data.info.rules;
    await window.dbUpdate(window.dbRef(window.db), updates);
    const totalAbsensi = Object.values(data.absensi).reduce((s, o) => s + Object.keys(o).length, 0);
    el.innerHTML = `<div class="alert ok">✅ Berhasil!<br>• ${data.promotor.length} promotor<br>• ${cBaru} transaksi baru (${cSkip} duplikat)${cTanpaPromotor > 0 ? `<br><span style="color:#d97706;">⚠️ ${cTanpaPromotor} transaksi tanpa promotor dikenali</span>` : ''}<br>• ${totalAbsensi} hari absensi</div>
      <button class="btn-soft btn-full" onclick="location.reload()">Refresh</button>`;
    window._masterData = null;
  } catch (err) { el.innerHTML = `<div class="alert err">❌ ${err.message}</div>`; }
}

  const targetUC = Number(document.getElementById('p_targetUC').value) || 16;
  const ikutUC = document.getElementById('p_ikutUC').value;
  const email = document.getElementById('p_email').value.trim().toLowerCase();
  
  const msg = document.getElementById('promotorMsg');
  
  if (!namaAbsen || !namaSales) { 
    msg.innerHTML = '<div class="alert err">Nama Tampilan & Nama Sales wajib diisi!</div>'; 
    return; 
  }

  try {
    const keyPromotor = sanitizeKey(namaAbsen);
    const updates = {};

    updates[`users/promotor/${keyPromotor}`] = { 
      namaAbsen, namaFinger, namaSales, merk, targetUC, ikutUC, aktif: true 
    };

    if (email) {
      const emailKey = email.replace(/\./g, ',');
      updates[`users/whitelist/${emailKey}`] = {
        email: email,
        nama: namaAbsen,
        role: 'PROMOTOR',
        promotorKey: keyPromotor
      };
    }

    await window.dbUpdate(window.dbRef(window.db), updates);
    
    msg.innerHTML = '<div class="alert ok">✅ Data Promotor & Email berhasil disimpan!</div>';
    ['p_namaAbsen','p_namaFinger','p_namaSales','p_merk','p_email'].forEach(id => document.getElementById(id).value = '');
    setTimeout(() => msg.innerHTML = '', 3000);
  } catch (err) { 
    msg.innerHTML = `<div class="alert err">❌ ${err.message}</div>`; 
  }
}

async function hapusPromotor(key, nama, whitelistKey) {
  tampilkanKonfirmasi('Hapus Promotor?', `Yakin hapus "${nama}" beserta akses emailnya?`, async () => {
    try {
      const updates = {};
      updates[`users/promotor/${key}`] = null;

      // Hapus whitelist berdasarkan key yang dikirim
      if (whitelistKey) {
        updates[`users/whitelist/${whitelistKey}`] = null;
      } else {
        // Fallback: cari manual semua whitelist yang promotorKey-nya = key
        const snapWl = await window.dbGet(window.dbRef(window.db, 'users/whitelist'));
        if (snapWl.exists()) {
          const wl = snapWl.val();
          Object.keys(wl).forEach(k => {
            if (wl[k] && wl[k].promotorKey === key) {
              updates[`users/whitelist/${k}`] = null;
            }
          });
        }
      }

      await window.dbUpdate(window.dbRef(window.db), updates);
      tampilkanNotif('Berhasil', 'Promotor dan Email dihapus.', 'success');
      renderTab(); // refresh tampilan
    } catch (err) {
      tampilkanNotif('Gagal', err.message, 'danger');
    }
  }, 'danger');
}

function renderTerlambat() {
  const listPromotor = Object.keys(allPromotor).map(k => ({ key: k, ...allPromotor[k] })).sort((a,b) => (a.namaAbsen || '').localeCompare(b.namaAbsen || ''));
  const today = new Date();
  const hariIni = today.getDate();
  const hariTerpilih = window._hariTerlambat || hariIni;
  
  let html = `
    <div class="card">
      <h3>Kelola Terlambat — ${getNamaBulanIndo(BULAN_INI)}</h3>
      <p>Pilih tanggal, lalu klik Tandai.</p>
      <div style="background:var(--soft); border:1px solid var(--border); border-radius:12px; padding:16px;">
        <label>Tanggal</label>
        <input type="number" id="tglTerlambat" min="1" max="31" value="${hariTerpilih}" 
               style="width:120px; font-size:18px; text-align:center; font-weight:800; padding:12px;"
               onchange="window._hariTerlambat = this.value; renderTab()">
      </div>
    </div>
    <div class="card"><h3>Daftar Promotor</h3>`;
  
  listPromotor.forEach(p => {
    const absensiP = allAbsensi[p.key] || {};
    const h = absensiP['hari_' + hariTerpilih];
    const adaFinger = h && h.masuk && String(h.masuk).trim() !== '' && h.masuk !== '-';
    const sudahTerlambat = adaFinger && String(h.terlambat || '').toUpperCase() === 'YA';
    let totalBulanIni = 0;
    Object.values(absensiP).forEach(a => {
      const adaMasuk = a && a.masuk && String(a.masuk).trim() !== '' && a.masuk !== '-';
      if (adaMasuk && String(a.terlambat || '').toUpperCase() === 'YA') totalBulanIni++;
    });
    html += `
      <div class="list-item ${sudahTerlambat ? 'late-item' : ''}">
        <div class="kiri">
          <div class="nama">${p.namaAbsen}</div>
          <div class="detail">${p.namaSales || '-'} • ${p.merk || '-'}
            ${!adaFinger ? '<span style="color:#94a3b8;"> • Belum ada finger</span>' : ''}
            ${totalBulanIni > 0 ? `<span style="color:#d97706; font-weight:700;"> • ${totalBulanIni}x terlambat</span>` : ''}
          </div>
        </div>
        <div class="kanan">
          ${sudahTerlambat ? '<span class="late-marker">TERLAMBAT</span>' : ''}
          ${adaFinger ? `<button class="${sudahTerlambat ? 'btn-danger' : 'btn-primary'} btn-sm" onclick="toggleTerlambat('${p.key}', ${hariTerpilih}, ${sudahTerlambat})">${sudahTerlambat ? 'Batal' : 'Tandai'}</button>`
          : `<button class="btn-soft btn-sm" disabled style="opacity:0.4;">-</button>`}
        </div>
      </div>`;
  });
  html += `</div>`;
  return html;
}

async function toggleTerlambat(promotorKey, hari, sudahTerlambat) {
  try {
    const path = `absensi/${BULAN_INI}/${promotorKey}/hari_${hari}`;

    if (snap.exists()) {

function pilihFileSOP(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 500 * 1024) { tampilkanNotif('File Besar', 'Maks 500KB.', 'danger'); return; }
  const reader = new FileReader();
  reader.onload = (evt) => {
    _sopImageData = evt.target.result;
    document.getElementById('sop_file_label').innerHTML = `<strong>✅ ${file.name}</strong><br><small>${Math.round(file.size/1024)} KB</small>`;
  };
  reader.readAsDataURL(file);
}

async function tombolSinkronPenjualan(event) {
  const btn = event.target;
  const originalText = btn.innerText;
  btn.innerText = 'Memproses...';
  btn.disabled = true;
  
  try {
    const bulan = BULAN_INI;
    const snapAll = await window.dbGet(window.dbRef(window.db, `penjualan/${bulan}/all`));
    if (!snapAll.exists()) { alert("❌ Data penjualan 'all' kosong!"); return; }
    
    const allPenjualan = snapAll.val();
    const updates = {};
    let count = 0;

    Object.keys(allPenjualan).forEach(txId => {
      const item = allPenjualan[txId];
      if (!item || !item.namaSales) return;
      
      const salesExcel = String(item.namaSales).trim().toUpperCase();
      let foundKey = null;

      for (const k of Object.keys(allPromotor)) {
        const p = allPromotor[k];
        const pSales = String(p.namaSales || '').trim().toUpperCase();
        
        if (pSales && (salesExcel.includes(pSales) || pSales.includes(salesExcel))) {
          foundKey = k;
          break;
        }
      }

      if (foundKey) {
        updates[`penjualan/${bulan}/per_promotor/${foundKey}/${txId}`] = item;
        count++;
      }
    });

    if (count > 0) {
      await window.dbUpdate(window.dbRef(window.db), updates);
      alert(`✅ BERHASIL! ${count} transaksi berhasil disinkronkan ke semua promotor.`);
    } else {
      alert("❌ Tidak ada transaksi yang cocok.");
    }
  } catch (err) {
    alert("Error: " + err.message);
  } finally {
    btn.innerText = originalText;
    btn.disabled = false;
  }
}

async function downloadBulanLama(bulanLama) {
  try {
    const [snapJualAll, snapJualRoot, snapAbsen] = await Promise.all([
      window.dbGet(window.dbRef(window.db, 'penjualan/' + bulanLama + '/all')),
      window.dbGet(window.dbRef(window.db, 'penjualan/' + bulanLama)),
      window.dbGet(window.dbRef(window.db, 'absensi/' + bulanLama))
    ]);
    let dataJual = snapJualAll.exists() ? Object.values(snapJualAll.val()) : [];
    if (dataJual.length === 0 && snapJualRoot.exists()) {
      const raw = snapJualRoot.val();
      dataJual = [];
      Object.keys(raw).forEach(k => { if (k !== 'all' && k !== 'per_promotor') dataJual.push(raw[k]); });
    }
    const dataAbsen = snapAbsen.exists() ? snapAbsen.val() : {};
    const wb = XLSX.utils.book_new();
    if (dataJual.length > 0) {
      const wsJual = XLSX.utils.json_to_sheet(dataJual.map(x => ({
        'No Faktur': x.noFaktur || '', 'Tanggal': x.tanggal || '',
        'Barcode': x.barcode || '', 'Nama Barang': x.namaBarang || '',
        'Qty': x.qty || 0, 'Subtotal': x.subtotal || 0,
        'Nama Sales': x.namaSales || '', 'Kategori': x.kategori || '',
        'Merk': x.merk || ''
      })));
      XLSX.utils.book_append_sheet(wb, wsJual, 'Penjualan');
    }
    const absenRows = [];
    Object.keys(dataAbsen).forEach(kp => {
      const p = allPromotor[kp] || {};
      const absensiP = dataAbsen[kp];
      Object.keys(absensiP).forEach(hk => {
        const a = absensiP[hk];
        if (a && typeof a === 'object') {
          absenRows.push({
            'Promotor': p.namaAbsen || a.nama || '-',
            'Hari': a.hari || '', 'Masuk': a.masuk || '', 'Istirahat 1': a.istirahat1 || '',
            'Kembali 1': a.kembali1 || '', 'Istirahat 2': a.istirahat2 || '',
            'Kembali 2': a.kembali2 || '', 'Pulang': a.pulang || '', 'Terlambat': a.terlambat || ''
          });
        }
      });
    });
    if (absenRows.length > 0) {
      const wsAbsen = XLSX.utils.json_to_sheet(absenRows);
      XLSX.utils.book_append_sheet(wb, wsAbsen, 'Absensi');
    }
    XLSX.writeFile(wb, `Backup_UFO_${bulanLama}.xlsx`);
    tampilkanNotif('Berhasil', 'File Excel berhasil diunduh!\n\nSetelah download selesai, klik "Reset Sekarang" untuk hapus data bulan lalu.', 'success');
  } catch (err) { tampilkanNotif('Gagal', 'Error: ' + err.message, 'danger'); }
}

async function downloadExcelBulanIni() {
  let dataJual = [];
  const snapAll = await window.dbGet(window.dbRef(window.db, 'penjualan/' + BULAN_INI + '/all'));
  if (snapAll.exists()) { dataJual = Object.values(snapAll.val()); } else { dataJual = Object.values(allPenjualan); }
  const absenRows = [];
  Object.keys(allAbsensi).forEach(kp => {
    const p = allPromotor[kp] || {};
    const absensiP = allAbsensi[kp];
    Object.keys(absensiP).forEach(hk => {
      const a = absensiP[hk];
      if (a && typeof a === 'object') {
        absenRows.push({
          'Promotor': p.namaAbsen || a.nama || '-', 'Hari': a.hari || '',
          'Masuk': a.masuk || '', 'Istirahat 1': a.istirahat1 || '',
          'Kembali 1': a.kembali1 || '', 'Istirahat 2': a.istirahat2 || '',
          'Kembali 2': a.kembali2 || '', 'Pulang': a.pulang || '', 'Terlambat': a.terlambat || ''
        });
      }
    });
  });
  if (dataJual.length === 0 && absenRows.length === 0) {
    tampilkanNotif('Kosong', 'Belum ada data bulan ini.', 'warning');
    return;
  }
  const wb = XLSX.utils.book_new();
  if (dataJual.length > 0) { XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dataJual), 'Penjualan'); }
  if (absenRows.length > 0) { XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(absenRows), 'Absensi'); }

  tampilkanNotif('Berhasil', 'File Excel diunduh.', 'success');
