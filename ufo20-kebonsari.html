  <script>
 
  document.addEventListener('contextmenu', event => event.preventDefault());

 
  document.onkeydown = function(e) {
    if (e.keyCode == 123) { return false; } // F12
    if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { return false; } // Ctrl+Shift+I
    if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) { return false; } // Ctrl+Shift+C
    if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { return false; } // Ctrl+Shift+J
    if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { return false; } // Ctrl+U
  }
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, get, update, remove, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCNj8nRMP0ijH1GUXKeJlsE-EG5AYCkHBU",
  authDomain: "dashboardpromotor.firebaseapp.com",

  projectId: "dashboardpromotor",

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

signInAnonymously(auth).then(() => {
  window.db = db; window.dbRef = ref; window.dbSet = set; window.dbGet = get;

<style>
:root {
  --bg: #f4f7f6; 
  --card: #ffffff; 
  --soft: #f8fafc;
  --text: #0f172a; 
  --muted: #64748b; 
  --border: #e2e8f0;
  --primary: #4f46e5; 
  --primary-dark: #4338ca;
  --success: #10b981; 
  --danger: #ef4444; 
  --warning: #f59e0b;
  --gold: #d4af37;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
  --radius: 16px;
}
* { box-sizing: border-box; font-family: 'Inter', sans-serif !important; -webkit-font-smoothing: antialiased; }
body { margin: 0; padding: 24px; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,0.03) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,0.03) 0, transparent 50%); }
.container { width: 100%; max-width: 960px; background: var(--card); border-radius: 24px; padding: 32px; box-shadow: 0 20px 40px -10px rgba(0,0,0,0.08); min-height: 90vh; border: 1px solid rgba(255,255,255,0.5); backdrop-filter: blur(20px); }

/* ===== HEADER ===== */
.header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 24px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
.header-left { display: flex; align-items: center; gap: 16px; }
.header-logo { width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, var(--primary), #818cf8); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 16px -4px rgba(79, 70, 229, 0.4); }
.header-logo svg { width: 24px; height: 24px; stroke: white; stroke-width: 2.5; fill: none; }
.header-title h1 { margin: 0; font-size: 20px; font-weight: 800; color: var(--text); letter-spacing: -0.5px; }
.header-title p { margin: 4px 0 0; font-size: 13px; color: var(--muted); font-weight: 500; }
.header-right { display: flex; gap: 10px; align-items: center; }
.header-user { padding: 8px 16px; background: #ecfdf5; color: #065f46; border-radius: 99px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; border: 1px solid #a7f3d0; }
.header-user::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 8px #10b981; }
.badge-bulan { padding: 8px 16px; background: #eff6ff; color: #1e40af; border-radius: 99px; font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; border: 1px solid #bfdbfe; }

/* ===== TABS ===== */
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; background: var(--soft); padding: 8px; border-radius: 16px; border: 1px solid var(--border); }
.tab-btn { flex: 1; min-width: 100px; padding: 12px 10px; border-radius: 12px; background: transparent; border: none; color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; display: flex; flex-direction: column; align-items: center; gap: 6px; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
.tab-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2.2; fill: none; transition: all 0.25s; }
.tab-btn:hover { background: white; color: var(--primary); box-shadow: var(--shadow-sm); }
.tab-btn.active { background: white; color: var(--primary); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15); border: 1px solid rgba(79, 70, 229, 0.1); }
.tab-btn.active svg { stroke: var(--primary); transform: scale(1.1); }

/* ===== CARDS & FORMS ===== */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow-sm); transition: all 0.3s ease; }
.card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.card h3 { margin: 0 0 16px; font-size: 15px; font-weight: 800; color: var(--text); display: flex; align-items: center; gap: 10px; }
.card h3 svg { width: 20px; height: 20px; stroke: var(--primary); stroke-width: 2.5; fill: none; }
.card p { margin: 0 0 16px; font-size: 13px; color: var(--muted); line-height: 1.6; }

label { display: block; font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
input, select, textarea { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--soft); font-size: 14px; font-weight: 600; color: var(--text); outline: none; transition: all 0.2s; }
textarea { resize: vertical; font-family: 'Inter', sans-serif !important; }
input:focus, select:focus, textarea:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }

/* ===== BUTTONS ===== */
button { padding: 12px 20px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); display: inline-flex; justify-content: center; align-items: center; gap: 8px; }
button svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.5; fill: none; }
button:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
button:active { transform: translateY(0); }
.btn-primary { background: linear-gradient(135deg, var(--primary), #6366f1); color: white; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25); }
.btn-primary:hover { background: linear-gradient(135deg, var(--primary-dark), var(--primary)); box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35); }
.btn-success { background: linear-gradient(135deg, #10b981, #059669); color: white; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25); }
.btn-success:hover { box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35); }
.btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25); }
.btn-danger:hover { box-shadow: 0 8px 20px rgba(239, 68, 68, 0.35); }
.btn-warning { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25); }
.btn-soft { background: white; color: var(--text); border: 1px solid var(--border); }
.btn-soft:hover { background: var(--soft); border-color: #cbd5e1; }
.btn-sm { padding: 8px 14px; font-size: 11px; width: auto; border-radius: 8px; }
.btn-full { width: 100%; }

/* ===== UPLOAD AREA ===== */
.file-wrap { border: 2px dashed #cbd5e1; border-radius: var(--radius); padding: 32px 20px; text-align: center; cursor: pointer; background: var(--soft); transition: all 0.25s; position: relative; overflow: hidden; }
.file-wrap:hover { background: #eff6ff; border-color: var(--primary); }
.file-wrap svg { width: 48px; height: 48px; stroke: var(--primary); stroke-width: 1.5; fill: none; margin-bottom: 12px; }
.file-wrap p { margin: 0; font-size: 14px; color: var(--muted); font-weight: 600; }
.file-wrap strong { color: var(--primary); }
.file-wrap input { display: none; }

/* ===== ALERTS ===== */
.alert { padding: 14px 16px; border-radius: 12px; font-size: 13px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: flex-start; gap: 10px; line-height: 1.5; }
.alert.ok { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
.alert.err { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
.alert.warn { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }

.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
.spinner-dark { border: 2px solid rgba(0,0,0,0.1); border-top-color: var(--primary); }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== LIST ITEMS ===== */
.list-item { background: white; border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 16px; transition: all 0.2s; }
.list-item:hover { box-shadow: var(--shadow); border-color: #cbd5e1; transform: translateX(4px); }
.list-item .kiri { flex: 1; min-width: 0; }
.list-item .nama { font-size: 14px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
.list-item .detail { font-size: 12px; color: var(--muted); margin-top: 4px; font-weight: 500; line-height: 1.5; }
.list-item .kanan { display: flex; gap: 8px; flex-shrink: 0; align-items: center; }
.list-item.late-item { border-left: 4px solid var(--warning); background: #fffbeb; }

/* ===== STATS ===== */
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.stat-card { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 20px 16px; text-align: center; transition: all 0.3s; }
.stat-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-4px); border-color: #cbd5e1; }
.stat-card .label { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.stat-card .value { font-size: 24px; font-weight: 900; color: var(--text); }
.stat-card.full { grid-column: 1 / -1; background: linear-gradient(135deg, #f0fdf4, #dcfce7); border-color: #bbf7d0; }
.stat-card.success .value { color: #059669; }

.late-marker { background: #fef3c7; border: 1px solid #fcd34d; border-radius: 8px; padding: 4px 10px; font-size: 10px; font-weight: 800; color: #92400e; text-transform: uppercase; letter-spacing: 0.5px; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }

.welcome-card { background: linear-gradient(135deg, #1e293b, #0f172a); color: white; border-radius: var(--radius); padding: 28px; margin-bottom: 24px; position: relative; overflow: hidden; box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.5); }
.welcome-card::before { content: ''; position: absolute; top: -50px; right: -50px; width: 250px; height: 250px; background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%); border-radius: 50%; }
.welcome-card h2 { margin: 0 0 8px; font-size: 24px; font-weight: 800; position: relative; letter-spacing: -0.5px; }
.welcome-card p { margin: 0; font-size: 14px; opacity: 0.8; position: relative; color: #cbd5e1; }

#loginBox { max-width: 400px; margin: 40px auto; animation: fadeIn 0.5s ease-out; }
#loginBox .card { background: white; padding: 32px; border-radius: 24px; box-shadow: 0 20px 40px -10px rgba(0,0,0,0.1); }
#loginBox h3 { font-size: 20px; text-align: center; margin-bottom: 24px; justify-content: center; }

/* ===== CUSTOM MODAL ===== */
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 99999; opacity: 0; visibility: hidden; transition: all 0.3s ease; padding: 16px; }
.modal-overlay.active { opacity: 1; visibility: visible; }
.modal-box { background: white; border-radius: 24px; padding: 32px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); transform: scale(0.9) translateY(20px); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); border: 1px solid rgba(255,255,255,0.2); }
.modal-overlay.active .modal-box { transform: scale(1) translateY(0); }
.modal-icon { width: 72px; height: 72px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 20px; }
.modal-icon.warning { background: #fef3c7; color: #d97706; }
.modal-icon.success { background: #ecfdf5; color: #10b981; }
.modal-icon.danger { background: #fef2f2; color: #ef4444; }
.modal-icon.info { background: #eff6ff; color: #3b82f6; }
.modal-icon svg { width: 36px; height: 36px; stroke: currentColor; stroke-width: 2.5; fill: none; }
.modal-title { font-size: 20px; font-weight: 800; color: var(--text); margin-bottom: 12px; letter-spacing: -0.5px; }
.modal-desc { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 28px; white-space: pre-line; }
.modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-actions.single { grid-template-columns: 1fr; }
.modal-actions.three { grid-template-columns: 1fr; gap: 8px; }
.modal-btn { padding: 14px 20px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.2s; display: inline-flex; justify-content: center; align-items: center; gap: 8px; font-family: inherit; }
.modal-btn-cancel { background: var(--soft); color: var(--text); border: 1px solid var(--border); }
.modal-btn-cancel:hover { background: var(--border); }
.modal-btn-ok-primary { background: linear-gradient(135deg, var(--primary), #6366f1); color: white; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25); }
.modal-btn-ok-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25); }
.modal-btn-ok-success { background: linear-gradient(135deg, #10b981, #059669); color: white; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25); }
.modal-btn-ok-warning { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25); }

/* ===== CUSTOM TOAST ===== */
.custom-toast {
  position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-20px);
  background: rgba(15, 23, 42, 0.95); color: #ffffff; padding: 16px 24px; border-radius: 14px;
  font-size: 14px; font-weight: 600; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.1); z-index: 999999; opacity: 0; visibility: hidden;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); display: flex; align-items: center; gap: 12px;
  backdrop-filter: blur(10px); max-width: 90%;
}
.custom-toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
.custom-toast svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2.5; fill: none; }

.hidden { display: none !important; }
.sop-preview { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 768px) {
  body { padding: 12px; }
  .container { padding: 20px; border-radius: 20px; }
  .header { flex-direction: column; align-items: flex-start; gap: 16px; }
  .header-right { width: 100%; justify-content: space-between; flex-wrap: wrap; }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tab-btn { padding: 12px 8px; font-size: 11px; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .list-item { flex-direction: column; align-items: stretch; gap: 12px; }
  .list-item .kanan { justify-content: flex-end; }
  .modal-actions.three { grid-template-columns: 1fr; }
}
</style>
</head>
