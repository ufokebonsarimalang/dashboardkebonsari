<script>
 
  document.addEventListener('contextmenu', event => event.preventDefault());

  
  document.onkeydown = function(e) {
    if (e.keyCode == 123) { return false; } // F12
    if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { return false; } // Ctrl+Shift+I
    if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) { return false; } // Ctrl+Shift+C
    if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { return false; } // Ctrl+Shift+J
    if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { return false; } // Ctrl+U
  }
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, get, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCNj8nRMP0ijH1GUXKeJlsE-EG5AYCkHBU",
  authDomain: "dashboardpromotor.firebaseapp.com",
  databaseURL: "https://dashboardpromotor-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "dashboardpromotor",
  storageBucket: "dashboardpromotor.firebasestorage.app",
  messagingSenderId: "474469951678",
  appId: "1:474469951678:web:f769fed156a36505cbd6ef"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

window.db = db;
window.dbGet = get;
window.dbRef = ref;
window.dbOnValue = onValue;
window.firebaseAuth = auth;
window.firebaseSignOut = signOut;
window.firebaseGoogleAuthProvider = GoogleAuthProvider;
window.firebaseSignInWithPopup = signInWithPopup;

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.firebaseUser = null;
    window.dispatchEvent(new Event('firebase-ready'));
    return;
  }
  if (!user.email) {
    showToast('Akun Google Anda tidak mengirimkan email. Coba login dengan akun Google lain.', 'error');
    await signOut(auth);
    return;
  }
  try {
    const emailKey = user.email.replace(/\./g, ',');
    const snap = await get(ref(db, 'users/whitelist/' + emailKey));
    if (!snap.exists()) {
      showToast('Akun Google Anda (' + user.email + ') tidak terdaftar. Hubungi admin.', 'error');
      await signOut(auth);
      return;
    }
    const wl = snap.val();
    window.firebaseUser = {
      email: user.email,
      uid: user.uid,
      namaTampil: wl.nama || user.displayName || user.email,
      role: wl.role || 'PROMOTOR',
      promotorKey: wl.promotorKey || null
    };
    window.dispatchEvent(new Event('firebase-ready'));
  } catch (err) {
    console.error('Gagal verifikasi whitelist:', err);
    showToast('Gagal verifikasi akun: ' + err.message, 'error');
    await signOut(auth);
  }
});
</script>

.card.late {
  border: 2px solid #facc15 !important;
  background: linear-gradient(135deg, rgba(17, 24, 39, 0.95), rgba(45, 35, 10, 0.9)) !important;
  box-shadow: 0 0 25px rgba(250, 204, 21, 0.7), 
              inset 0 0 20px rgba(250, 204, 21, 0.15) !important;
  animation: pulseLate 2s ease-in-out infinite;
  position: relative;
}
.card.late::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, #facc15, transparent);
  animation: scanLate 2s linear infinite;
}
@keyframes pulseLate {
  0%, 100% { 
    box-shadow: 0 0 25px rgba(250, 204, 21, 0.7), 
                inset 0 0 20px rgba(250, 204, 21, 0.15);
  }
  50% { 
    box-shadow: 0 0 40px rgba(250, 204, 21, 1), 
                inset 0 0 30px rgba(250, 204, 21, 0.25);

}
@keyframes scanLate {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}
.card.late .tanggal {

.fut-card {

  position: relative;
  overflow: hidden;
  animation: cardEnter 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
  backdrop-filter: blur(24px);
}

.fut-card::before {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: conic-gradient(from 0deg, transparent, rgba(56, 189, 248, 0.15), transparent 30%);
  animation: cardRotate 8s linear infinite;
  pointer-events: none;
  z-index: 0;
}

.fut-card::after {
  content: '';
  position: absolute;
  inset: 1px;
  border-radius: 23px;
  background: linear-gradient(160deg, rgba(15, 23, 42, 0.95) 0%, rgba(2, 6, 23, 0.98) 100%);
  z-index: 1;
  pointer-events: none;
}

.fut-card > * {
  position: relative;
  z-index: 2;
}

@keyframes cardEnter {
  from { opacity: 0; transform: translateY(30px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes cardRotate {
  to { transform: rotate(360deg); }
