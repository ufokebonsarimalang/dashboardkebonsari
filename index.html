<script>
  // Mencegah klik kanan
  document.addEventListener('contextmenu', event => event.preventDefault());

  // Mencegah tombol F12, Ctrl+Shift+I, Ctrl+U (View Source)
  document.onkeydown = function(e) {
    if (e.keyCode == 123) { return false; } // F12
    if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { return false; } // Ctrl+Shift+I
    if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) { return false; } // Ctrl+Shift+C
    if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { return false; } // Ctrl+Shift+J
    if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { return false; } // Ctrl+U
  }
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, get, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {

  apiKey: "AIzaSyCcBuaevlaemlP2mX87gGi2JwGR29Y05as",

  authDomain: "dashboardkebonsari.firebaseapp.com",

  databaseURL: "https://dashboardkebonsari-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId: "dashboardkebonsari",

  storageBucket: "dashboardkebonsari.firebasestorage.app",

  messagingSenderId: "68113369328",

  appId: "1:68113369328:web:200be7e778bdc9104b5a35"

};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

window.db = db;
window.dbGet = get;
window.dbRef = ref;
window.dbOnValue = onValue;
window.firebaseAuth = auth;
window.firebaseSignOut = signOut;
window.firebaseGoogleAuthProvider = GoogleAuthProvider;
window.firebaseSignInWithPopup = signInWithPopup;

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.firebaseUser = null;
    window.dispatchEvent(new Event('firebase-ready'));
    return;
  }
  if (!user.email) {
    showToast('Akun Google Anda tidak mengirimkan email. Coba login dengan akun Google lain.', 'error');
    await signOut(auth);
    return;
  }
  try {
    const emailKey = user.email.replace(/\./g, ',');
    const snap = await get(ref(db, 'users/whitelist/' + emailKey));
    if (!snap.exists()) {
      showToast('Akun Google Anda (' + user.email + ') tidak terdaftar. Hubungi admin.', 'error');
      await signOut(auth);
      return;
    }
    const wl = snap.val();
    window.firebaseUser = {
      email: user.email,
      uid: user.uid,
      namaTampil: wl.nama || user.displayName || user.email,
      role: wl.role || 'PROMOTOR',
      promotorKey: wl.promotorKey || null
    };
    window.dispatchEvent(new Event('firebase-ready'));
  } catch (err) {
    console.error('Gagal verifikasi whitelist:', err);
    showToast('Gagal verifikasi akun: ' + err.message, 'error');
    await signOut(auth);
  }
});
</script>

.fut-card {

  position: relative;
  overflow: hidden;
  animation: cardEnter 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
  backdrop-filter: blur(24px);

.fut-card::before {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: conic-gradient(from 0deg, transparent, rgba(56, 189, 248, 0.15), transparent 30%);
  animation: cardRotate 8s linear infinite;
  pointer-events: none;
  z-index: 0;
}

.fut-card::after {
  content: '';
  position: absolute;
  inset: 1px;
  border-radius: 23px;
  background: linear-gradient(160deg, rgba(15, 23, 42, 0.95) 0%, rgba(2, 6, 23, 0.98) 100%);
  z-index: 1;
  pointer-events: none;
}

.fut-card > * {
  position: relative;
  z-index: 2;
}

@keyframes cardEnter {
  from { opacity: 0; transform: translateY(30px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes cardRotate {

/* ===== FUNGSI TOAST KUSTOM ===== */
function showToast(pesan, tipe = 'info') {
  const oldToast = document.querySelector('.custom-toast');
  if (oldToast) oldToast.remove();

  const toast = document.createElement('div');
  toast.className = 'custom-toast';
  
  let icon = '🔔';
  if (tipe === 'sukses') icon = '✅';
  else if (tipe === 'error') icon = '⚠️';

  toast.innerHTML = `<span style="font-size:18px;">${icon}</span> <span>${pesan}</span>`;
  document.body.appendChild(toast);

  setTimeout(() => toast.classList.add('show'), 10);
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}
window.showToast = showToast;

/* ===== CACHE HELPER ===== */
const CACHE_TTL = 5 * 60 * 1000;
function cacheGet(key) {
  try {
    const raw = sessionStorage.getItem('ufo_' + key);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (Date.now() - obj.ts > CACHE_TTL) {
      sessionStorage.removeItem('ufo_' + key);
      return null;
    }
    return obj.data;
  } catch (e) { return null; }
}
function cacheSet(key, data) {
  try {
    sessionStorage.setItem('ufo_' + key, JSON.stringify({ ts: Date.now(), data }));
  } catch (e) {}
}
window.cacheGet = cacheGet;
window.cacheSet = cacheSet;

/* ===== SANITASI XSS ===== */
function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}
window.escapeHtml = escapeHtml;

function safeImageUrl(url) {
    if (!url) return '';
    const s = String(url).trim();

    // 1) Izinkan data URL gambar (base64) — dari upload admin
    if (/^data:image\/(png|jpe?g|gif|webp|bmp|svg\+xml);base64,[A-Za-z0-9+/=\s]+$/i.test(s)) {
        return s; // jangan di-escape, data URL aman & escapeHtml akan merusak base64
    }

    // 2) Izinkan http & https (untuk gambar dari URL eksternal)
    if (/^https?:\/\//i.test(s)) {
        return escapeHtml(s);
    }

    return '';
}

/* ===== PARTICLES ===== */
function initParticles() {
    const container = document.getElementById('fut-particles');
    if (!container) return;
    container.innerHTML = '';
    for (let i = 0; i < 25; i++) {
        const p = document.createElement('div');
        p.className = 'fut-particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (8 + Math.random() * 12) + 's';
        p.style.animationDelay = (Math.random() * 10) + 's';
        const colors = ['#22d3ee', '#a855f7', '#3b82f6'];
        const color = colors[Math.floor(Math.random() * colors.length)];
        p.style.background = color;
        p.style.boxShadow = `0 0 6px ${color}, 0 0 12px ${color}`;
        container.appendChild(p);
    }
}

/* ===== LOGIN DENGAN GOOGLE ===== */
async function loginDenganGoogle() {
    const btn = document.getElementById('btn-login-google');
    const txt = document.getElementById('btn-login-text');
    const asli = txt.innerText;
    btn.disabled = true;
    txt.innerText = 'MEMBUKA GOOGLE...';

    try {
        const provider = new window.firebaseGoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        await window.firebaseSignInWithPopup(window.firebaseAuth, provider);
    } catch (err) {
        console.error('Login gagal:', err);
        if (err.code !== 'auth/popup-closed-by-user') {
            showToast('Login gagal: ' + err.message, 'error');
        }
        btn.disabled = false;
        txt.innerText = asli;
    }
}
window.loginDenganGoogle = loginDenganGoogle;

/* ===== LOAD PROMOTOR LIST (pakai cache + get) ===== */
async function loadPromotorList(forceRefresh = false) {
  const liveEl = document.getElementById('live-status-text');
  if (!window.firebaseAuth || !window.firebaseAuth.currentUser) {
    if (liveEl) liveEl.innerText = 'System Ready';
    return;
  }

  let data = forceRefresh ? null : cacheGet('promotor_list');
  if (!data) {
    try {
      const snap = await window.dbGet(window.dbRef(window.db, 'users/promotor'));
      allPromotor = snap.exists() ? snap.val() : {};
      cacheSet('promotor_list', allPromotor);
    } catch (err) {
      console.error('Gagal load promotor:', err);
      allPromotor = {};
    }
  } else {
    allPromotor = data;
  }

  const list = Object.keys(allPromotor).map(k => ({ key: k, ...allPromotor[k] }))
    .filter(p => p.aktif !== false)
    .sort((a,b) => (a.namaAbsen || '').localeCompare(b.namaAbsen || ''));
  if (liveEl) liveEl.innerText = `${list.length} promotor terdaftar`;
  if (currentUser && currentUser.role === 'ADMIN') {
    isiDropdownPromotor(list);
  }
}
window.loadPromotorList = loadPromotorList;

function isiDropdownPromotor(list) {
  const menuEl = document.getElementById('dropdownMenu');
  const labelEl = document.getElementById('dropdownLabel');
  const hiddenInput = document.getElementById('selectPromotor');
  if (!menuEl) return;
  if (!list || list.length === 0) {
    menuEl.innerHTML = '<div class="dd-option" style="color:#64748b;font-style:italic;justify-content:center;">Belum ada promotor</div>';
    if (labelEl) labelEl.innerText = '-- Pilih Nama Promotor --';
    return;
  }
  let html = '';
  list.forEach(p => {
    const key = escapeHtml(p.key);
    const label = escapeHtml(p.namaAbsen || '-');
    html += `<div class="dd-option" data-value="${key}" onclick="pilihDropdownPromotor('${key}', '${label}')">${label}</div>`;
  });
  menuEl.innerHTML = html;
  if (promotorTerpilih && allPromotor[promotorTerpilih]) {
    const activeProm = allPromotor[promotorTerpilih];
    const namaAktif = activeProm.namaAbsen || '-';
    if (labelEl) labelEl.innerText = namaAktif;
    if (hiddenInput) hiddenInput.value = promotorTerpilih;
    const selectedOpt = menuEl.querySelector(`.dd-option[data-value="${promotorTerpilih}"]`);
    if (selectedOpt) {
      menuEl.querySelectorAll('.dd-option').forEach(o => o.classList.remove('selected'));
      selectedOpt.classList.add('selected');
    }
  } else {
    if (labelEl) labelEl.innerText = '-- Pilih Nama Promotor --';
    if (hiddenInput) hiddenInput.value = '';
  }
}
window.isiDropdownPromotor = isiDropdownPromotor;

function toggleDropdownPromotor() {
  const menu = document.getElementById('dropdownMenu');
  const trigger = document.getElementById('dropdownTrigger');
  if (!menu || !trigger) return;
  const isOpen = menu.classList.contains('open');
  if (isOpen) {
    menu.classList.remove('open');
    trigger.classList.remove('open');
  } else {
    menu.classList.add('open');
    trigger.classList.add('open');
  }
}
window.toggleDropdownPromotor = toggleDropdownPromotor;

function pilihDropdownPromotor(key, label) {
  const menu = document.getElementById('dropdownMenu');
  const trigger = document.getElementById('dropdownTrigger');
  const labelEl = document.getElementById('dropdownLabel');
  const hidden = document.getElementById('selectPromotor');
  if (hidden) hidden.value = key;
  if (labelEl) labelEl.innerText = label;
  if (menu) {
    menu.querySelectorAll('.dd-option').forEach(o => {
      o.classList.toggle('selected', o.dataset.value === key);
    });
    menu.classList.remove('open');
  }
  if (trigger) trigger.classList.remove('open');
  gantiPromotorAdmin(key);
}
window.pilihDropdownPromotor = pilihDropdownPromotor;

document.addEventListener('click', (e) => {
  const wrap = document.getElementById('customDropdownWrap');
  const menu = document.getElementById('dropdownMenu');
  const trigger = document.getElementById('dropdownTrigger');
  if (!wrap || !menu || !trigger) return;
  if (!wrap.contains(e.target)) {
    menu.classList.remove('open');
    trigger.classList.remove('open');
  }
});

/* ===== LOAD INFO (Promo/SOP) — tetap realtime, kecil ===== */
let infoListenerAttached = false;
function loadInfoRealtime() {
  if (infoListenerAttached) return;
  infoListenerAttached = true;
  if (!window.firebaseAuth || !window.firebaseAuth.currentUser) return;
  
  // Memantau perubahan data secara real-time
  window.dbOnValue(window.dbRef(window.db, 'info'), snap => {
    if (snap.exists()) {
      const data = snap.val();
      infoData.promo = data.promo || [];
      infoData.rules = data.rules || [];
    } else {
      infoData.promo = [];
      infoData.rules = [];
    }
    
    // Jika promotor sedang membuka menu Promo atau SOP, update layarnya otomatis
    if (currentMenu === 'promo' || currentMenu === 'sop') {
      tampilkanDetail(currentMenu, true); // parameter true = jangan tampilkan loading
    }
  });
}

/* ===== DASHBOARD ===== */
async function tampilkanDashboard() {
  if (!window.firebaseUser) {
    console.warn('Belum login Google');
    return;
  }
  
   currentUser = {
    key: window.firebaseUser.promotorKey || window.firebaseUser.uid,
    email: window.firebaseUser.email,
    namaAbsen: window.firebaseUser.namaTampil,
    role: window.firebaseUser.role,
    loginType: 'google'
  };

  if (window.firebaseUser.promotorKey && allPromotor[window.firebaseUser.promotorKey]) {
    const p = allPromotor[window.firebaseUser.promotorKey];
    if (p.namaAbsen) {
      currentUser.namaAbsen = p.namaAbsen;
    }
    currentUser.namaSales = p.namaSales || '';
    currentUser.merk = p.merk || '';
  }

  document.body.classList.remove('login-active');
  document.body.classList.add('dashboard-active');
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').classList.remove('hidden');

  await loadPromotorList();

  const isAdmin = currentUser.role === 'ADMIN';
  if (isAdmin) {
    promotorTerpilih = null;
    document.getElementById('promotorSelector').classList.remove('hidden');
    document.getElementById('userNama').innerHTML = 
      `${ICONS.crown} <b>${escapeHtml(currentUser.namaAbsen)}</b> <span class="admin-badge-inline">ADMIN</span>`;
    document.getElementById('topBar').classList.add('admin-mode');
  } else {
    promotorTerpilih = currentUser.key;
    document.getElementById('promotorSelector').classList.add('hidden');
    document.getElementById('userNama').innerHTML = 
      `<b>${escapeHtml(currentUser.namaAbsen)}</b>`;
    document.getElementById('topBar').classList.remove('admin-mode');
  }

  await muatDataBulanIni();
  renderMenuGrid();
  
  // Cek status tombol refresh
  const today = new Date().toDateString();
  const lastRefresh = localStorage.getItem('ufo_last_refresh_' + currentUser.key);
  const btnRefresh = document.querySelector('.refresh-btn');
  if (btnRefresh && lastRefresh === today) {
    btnRefresh.disabled = true;
    btnRefresh.style.opacity = '0.5';
    btnRefresh.title = 'Sudah refresh hari ini';
  }
}
window.tampilkanDashboard = tampilkanDashboard;

/* ===== LOADER DATA (pakai cache + get) ===== */
async function muatDataBulanIni(forceRefresh = false) {
  const isAdminRole = currentUser.role === 'ADMIN';

  // --- Penjualan ---
  const pathProm = isAdminRole
    ? 'penjualan/2026-10/all'
    : 'penjualan/2026-10/per_promotor/' + currentUser.key;
  const cacheKeyProm = isAdminRole ? 'penjualan_2026-10_all' : 'penjualan_2026-10_' + currentUser.key;

  let dataPenjualan = forceRefresh ? null : cacheGet(cacheKeyProm);
  if (!dataPenjualan) {
    try {
      const snap = await window.dbGet(window.dbRef(window.db, pathProm));
      allPenjualan = [];
      if (snap.exists()) {
        Object.values(snap.val()).forEach(item => {
          if (item && item.namaSales) allPenjualan.push(item);
        });
      }
      // Fallback ke root (kalau data belum dimigrasi)
      if (allPenjualan.length === 0) {
        const snapRoot = await window.dbGet(window.dbRef(window.db, 'penjualan/2026-10'));

/* ===== HELPER ===== */
function tanggalKeNama(tglStr) {
  if (!tglStr) return '-';
  const parts = String(tglStr).split('/');
  if (parts.length !== 3) return tglStr;
  const mm = parseInt(parts[0]);
  const dd = parseInt(parts[1]);
  const yyyy = parts[2];
  if (isNaN(dd) || isNaN(mm)) return tglStr;
  const namaBulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
                     'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  return `${dd} ${namaBulan[mm - 1] || '?'} ${yyyy}`;
}

function parseTanggal(str) {
  if (!str) return null;
  const s = String(str).trim();
  
  // Format YYYY-MM-DD (ISO)
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) {
    const p = s.split(' ')[0].split('-');
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }
  
  const p = s.split('/');
  if (p.length !== 3) return null;
  
  let part1 = Number(p[0]);
  let part2 = Number(p[1]);
  let part3 = Number(p[2]);
  
  // Jika tahun di depan
  if (part1 > 2000) return new Date(part1, part2 - 1, part3);
  
  let tgl, bln;
  if (part1 > 12) {
    tgl = part1; bln = part2;
  } else if (part2 > 12) {
    tgl = part2; bln = part1; 
  } else {
    tgl = part1; bln = part2; // Paksa format Indonesia (Tgl/Bln/Thn)
  }
  
  const d = new Date(part3, bln - 1, tgl);
  return isNaN(d.getTime()) ? null : d;
}
 function getPeriodeRentangDinamis() {
  const semuaPenjualan = typeof allPenjualan !== 'undefined' ? allPenjualan : [];
  const namaBulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  
  // 1. Otomatis mendeteksi bulan & tahun berjalan saat ini
  const today = new Date();
  const targetBulan = today.getMonth(); 
  const targetTahun = today.getFullYear();
  
  // 2. Tentukan tanggal awal (Tanggal 1 bulan ini)
  const tglAwal = `1 ${namaBulan[targetBulan]} ${targetTahun}`;
  
  // Jika belum ada data sama sekali
  if (!semuaPenjualan || semuaPenjualan.length === 0) {
    return { pertama: tglAwal, terakhir: '-' };
  }
  
  // 3. Cari tanggal paling besar (terakhir) khusus di bulan berjalan
  let maxDate = null;
  semuaPenjualan.forEach(x => {
    if (!x || !x.tanggal) return;
    const d = parseTanggal(x.tanggal);
    
    // Pastikan hanya memproses tanggal yang bulan & tahunnya sama dengan bulan ini
    if (d && d.getMonth() === targetBulan && d.getFullYear() === targetTahun) {
      if (!maxDate || d > maxDate) {
        maxDate = d;
      }
    }
  });
  
  // Jika tidak ada tanggal yang lolos filter
  if (!maxDate) {
    return { pertama: tglAwal, terakhir: '-' };
  }
  
  // 4. Format tanggal terakhir menjadi teks (contoh: "19 Oktober 2026")
  const tglTerakhirStr = `${String(maxDate.getDate()).padStart(2, '0')} ${namaBulan[maxDate.getMonth()]} ${maxDate.getFullYear()}`;
  
  return {
    pertama: tglAwal,
    terakhir: tglTerakhirStr
  };
}

/* ===== RENDER: BRAND ===== */
function renderBrand() {
    const isAdmin = currentUser.role === 'ADMIN';
    if (isAdmin && !promotorTerpilih) {
      return `<div class="empty-state">${ICONS.empty}<div class="pesan">Silakan pilih promotor terlebih dahulu dari menu di atas</div></div>`;
    }
    const listAll = getDataSaya();
    const dataProm = getPromotorTerpilih();
    const brandPromotor = dataProm && dataProm.merk ? String(dataProm.merk).trim().toUpperCase() : "";
    const list = listAll.filter(x => {
        if (!x) return false;
        const tgl = String(x.tanggal || '');
        const noFaktur = String(x.nomorFaktur || x.noFaktur || '').toUpperCase();
        const merkBarang = String(x.merk || '').trim().toUpperCase();
        const kat = String(x.kategori || '').trim().toUpperCase();
        if (kat === 'GARANSI' || kat === 'ONGKOS') return false;
        const isOktoberFaktur = noFaktur.includes('2610');
        const isOktoberTgl = tgl.includes('/10/2026') || tgl.includes('2026-10');
        const isMatchBrand = !brandPromotor || (merkBarang === brandPromotor || merkBarang.includes(brandPromotor));
        return (isOktoberFaktur || isOktoberTgl) && isMatchBrand;
    });
    let totalBrandQty = 0, totalOmzetBrand = 0;
    list.forEach(x => {
        totalBrandQty += Number(x.qty || 1);
        totalOmzetBrand += Number(x.subtotal || x.omzet || 0);
    });
    const periode = getPeriodeRentangDinamis();
    const namaPromotor = escapeHtml(dataProm ? dataProm.namaAbsen : "Promotor");
    const infoMerk = escapeHtml(dataProm && dataProm.merk ? dataProm.merk : "Semua Brand");
    let html = `
        <div class="summary-card">
            <h2>${ICONS.brand} ${namaPromotor}</h2>
            <p>Brand : <b>${infoMerk}</b></p>
            <p>Periode : <b>${periode.pertama} - ${periode.terakhir}</b></p>
            <p>Total Perolehan Unit : <b>${totalBrandQty} Unit</b></p>
            <p>Total Omzet Brand : <span style="font-weight:bold; color:#34d399;">Rp ${totalOmzetBrand.toLocaleString("id-ID")}</span></p>
        </div>
    `;
    if (list.length === 0) {
        return html + `<div class="card"><div style="text-align:center; padding:20px; color:#9ca3af;">Belum ada data penjualan untuk brand ${infoMerk}</div></div>`;
    }
    const grupTanggal = {};
    list.forEach(x => {
        const tglKey = x.tanggal || 'Tanpa Tanggal';
        if (!grupTanggal[tglKey]) grupTanggal[tglKey] = [];
        grupTanggal[tglKey].push(x);
    });
    const keysSorted = Object.keys(grupTanggal).sort((a, b) => {
        const da = parseTanggal(a), db = parseTanggal(b);
        return (db || 0) - (da || 0);
    });
    html += `<div class="card-grid">`;
    keysSorted.forEach(tgl => {
        const items = grupTanggal[tgl];
        let subQty = 0, subOmzet = 0;
        let isiProduk = '';
        items.forEach((it, idx) => {
            const q = Number(it.qty || 1);
            const om = Number(it.subtotal || it.omzet || 0);
            subQty += q;
            subOmzet += om;
            isiProduk += `
                <div style="${idx > 0 ? 'margin-top:8px; padding-top:6px; border-top:1px solid rgba(255,255,255,0.05);' : ''}">
                    <div style="font-size:11px; color:#d4af37; margin-bottom:2px;">Brand: ${escapeHtml(it.merk || infoMerk)}</div>
                    <div style="font-size:11px; color:#9ca3af; margin-bottom:2px;">Kategori: ${escapeHtml(it.kategori || '-')}</div>
                    <div style="font-size:12.5px; font-weight:600; line-height:1.3; margin-bottom:4px; color:#e5e7eb;">${escapeHtml(it.namaBarang || it.produk || '-')}</div>
                    <div class="row"><span>Qty</span><span>${q} Unit</span></div>
                    <div class="row"><span>Omzet</span><span>Rp ${om.toLocaleString("id-ID")}</span></div>
                </div>
            `;
        });
        html += `
        <div class="card success">
            <div class="tanggal">${ICONS.calendar} ${tanggalKeNama(tgl)}</div>
            ${isiProduk}
            <div class="row" style="font-weight:700; font-size:13px; margin-top:6px; border-top:1px solid rgba(255,255,255,0.1); padding-top:6px;">
                <span>Total Hari Ini</span>
                <span style="color:#34d399;">${subQty} Unit (Rp ${subOmzet.toLocaleString("id-ID")})</span>
            </div>
        </div>`;
    });
    html += `</div>`;
    return html;
}

/* ===== MODAL SOP ===== */
function bukaModalSOP(urlGambar, judulSop) {
  const old = document.getElementById('sopModal');
  if (old) old.remove();
  if (!urlGambar) return;
  
  const modalDiv = document.createElement("div");
  modalDiv.id = "sopModal";
  modalDiv.style.cssText = `
    position: fixed; 
    top: 0; left: 0; 
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.9); 
    backdrop-filter: blur(8px);
    display: flex; 
    justify-content: center; 
    align-items: center; 
    z-index: 999999;
    padding: 16px;
  `;
  modalDiv.onclick = function(e) {
    if (e.target === modalDiv) modalDiv.remove();
  };
  
  const judulEsc = escapeHtml(judulSop);
  modalDiv.innerHTML = `
    <div style="
      position: relative; 
      max-width: 95%; 
      max-height: 85vh;
      background: #111827; 
      padding: 20px 15px 15px; 
      border-radius: 16px;
      border: 1px solid rgba(212, 175, 55, 0.4);
      box-shadow: 0 25px 50px rgba(0,0,0,0.7); 
      text-align: center;
    ">
      <div onclick="document.getElementById('sopModal').remove()" style="
        position: absolute; 
        top: -10px; 
        right: -10px;
        background: #ef4444; 
        color: #fff; 
        width: 32px; 
        height: 32px;
        border-radius: 50%; 
        display: flex; 
        align-items: center; 
        justify-content: center;
        font-size: 16px; 
        font-weight: 700; 
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
        border: 2px solid #fff;
      ">✕</div>
      <div style="
        color: #d4af37; 
        font-weight: 700; 
        font-size: 15px; 
        margin-bottom: 10px;
      ">📌 ${judulEsc}</div>
      <img 
        src="${urlGambar}" 
        alt="${judulEsc}" 
        style="
          width: 100%; 
          max-height: 70vh; 
          object-fit: contain; 
          border-radius: 10px;
        "
      >
    </div>
  `;
  document.body.appendChild(modalDiv);
}
window.bukaModalSOP = bukaModalSOP;

function renderPerolehan() {
    if (!allPenjualan || allPenjualan.length === 0) {

    }
    const perPromotor = {};
    Object.keys(allPromotor).forEach(key => {
        const p = allPromotor[key];
        if (p.aktif === false) return;
        perPromotor[key] = {
            key: key,
            nama: p.namaAbsen || '-',
            omzet: 0, unit: 0, transaksi: 0, uc: 0, brand: 0
        };

    allPenjualan.forEach(x => {

        const brg = String(x.namaBarang || '').toUpperCase();

                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                if (pMerk && kat !== 'GARANSI' && kat !== 'ONGKOS') {
                    if (merkBarang === pMerk || merkBarang.includes(pMerk)) {
                        perPromotor[k].brand += omzetTrans;
                    }
                }
                if (kat === 'GARANSI' && brg.includes('UFO CARE')) {
                    perPromotor[k].uc += Number(x.qty || 1);
                }
            }
        });
    });
    const arr = Object.values(perPromotor).sort((a, b) => b.omzet - a.omzet);
    const dataExcel = arr.map((p, i) => ({
        'No': i + 1,
        'Nama Promotor': p.nama,
        'Perolehan Toko': p.omzet,
        'Perolehan Brand': p.brand,
        'Perolehan UC': p.uc
    }));
    const totalOmzet = arr.reduce((s, x) => s + x.omzet, 0);
    const totalBrand = arr.reduce((s, x) => s + x.brand, 0);
    const totalUC = arr.reduce((s, x) => s + x.uc, 0);
    dataExcel.push({
        'No': '',
        'Nama Promotor': 'TOTAL',
        'Perolehan Toko': totalOmzet,
        'Perolehan Brand': totalBrand,
        'Perolehan UC': totalUC
    });
    const ws = XLSX.utils.json_to_sheet(dataExcel);
    ws['!cols'] = [{ wch: 5 }, { wch: 28 }, { wch: 18 }, { wch: 18 }, { wch: 14 }];
    const range = XLSX.utils.decode_range(ws['!ref']);
    for (let R = 1; R <= range.e.r; R++) {
        for (let C = 2; C <= 3; C++) {
            const cellAddr = XLSX.utils.encode_cell({ r: R, c: C });
            if (ws[cellAddr] && typeof ws[cellAddr].v === 'number') {
                ws[cellAddr].t = 'n';
                ws[cellAddr].z = '#,##0';
            }
        }
        const ucCell = XLSX.utils.encode_cell({ r: R, c: 4 });
        if (ws[ucCell] && typeof ws[ucCell].v === 'number') {
            ws[ucCell].t = 'n';
            ws[ucCell].z = '#,##0';
        }
    }
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Perolehan Promotor');
    const tglFile = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(wb, `Perolehan_Promotor_UFO_${tglFile}.xlsx`);
}
window.unduhExcelPerolehan = unduhExcelPerolehan;

/* ===== RENDER: DENDA (ADMIN) ===== */
function renderDenda() {
    const DENDA_UC_PER_UNIT = 5000;
    const DENDA_LATE_PER_KALI = 10000;
    const TARGET_UC_DEFAULT = 16;
    if (!allPromotor || Object.keys(allPromotor).length === 0) {
        return `<div class="empty-state">${ICONS.empty}<div class="pesan">Belum ada data promotor</div></div>`;
    }
    let html = `
        <div class="summary-card">
            <h2>${ICONS.warning} Denda & Keterlambatan Semua Promotor</h2>
            <div style="display:flex; flex-wrap:wrap; gap:10px; margin-top:8px;">
                <div style="flex:1; min-width:140px; background:rgba(239,68,68,0.1); padding:10px; border-radius:10px; border:1px solid rgba(239,68,68,0.3);">
                    <div style="font-size:10px; color:#9ca3af; font-weight:700;">DENDA UFO CARE</div>
                    <div style="font-size:12.5px; color:#f87171; font-weight:700; margin-top:2px;">Rp 5.000 / Unit</div>
                </div>
                <div style="flex:1; min-width:140px; background:rgba(250,204,21,0.1); padding:10px; border-radius:10px; border:1px solid rgba(250,204,21,0.3);">
                    <div style="font-size:10px; color:#9ca3af; font-weight:700;">DENDA LATE</div>
                    <div style="font-size:12.5px; color:#facc15; font-weight:700; margin-top:2px;">Rp 10.000 / Kali</div>
                </div>
            </div>
        </div>
        <div class="card-grid">
    `;
    Object.keys(allPromotor).forEach(key => {
        const p = allPromotor[key];
        if (p.aktif === false) return;
        const cleanNama = String(p.namaSales || p.namaAbsen || '').trim().toUpperCase();
        let totalUC = 0;
        allPenjualan.forEach(x => {
            if (!x || !x.namaSales) return;
            const salesTrans = String(x.namaSales).trim().toUpperCase();
            const kat = String(x.kategori || '').trim().toUpperCase();
            const brg = String(x.namaBarang || '').toUpperCase();
            const isMine = (salesTrans === cleanNama) || salesTrans.includes(cleanNama) || cleanNama.includes(salesTrans);
            if (isMine && kat === 'GARANSI' && brg.includes('UFO CARE')) {
                totalUC += Number(x.qty || 1);
            }
        });
        const absensiP = allAbsensiAll[key] || {};
        let totalTerlambat = 0;
        Object.values(absensiP).forEach(a => {
            if (a && String(a.terlambat || '').toUpperCase() === 'YA') totalTerlambat++;
        });
        const isIkutUC = String(p.ikutUC || 'YA').toUpperCase() !== 'TIDAK';
        const targetUC = isIkutUC ? Number(p.targetUC || TARGET_UC_DEFAULT) : 0;
        const kurangUC = (isIkutUC && totalUC < targetUC) ? (targetUC - totalUC) : 0;
        const dendaUC = kurangUC * DENDA_UC_PER_UNIT;
        const dendaLate = totalTerlambat * DENDA_LATE_PER_KALI;
        const totalDenda = dendaUC + dendaLate;
        html += `
            <div class="card ${totalDenda > 0 ? 'warning' : 'success'}">
                <div class="tanggal">${escapeHtml(p.namaAbsen || '-')}</div>
                <div class="row"><span>Denda UFO CARE</span><span style="color:${dendaUC > 0 ? '#f87171' : '#34d399'};">Rp ${dendaUC.toLocaleString('id-ID')}</span></div>
                <div class="row"><span>Denda Late (${totalTerlambat}x)</span><span style="color:${dendaLate > 0 ? '#facc15' : '#34d399'};">Rp ${dendaLate.toLocaleString('id-ID')}</span></div>
                <div class="row" style="border-top:1px solid rgba(255,255,255,0.1); margin-top:6px; padding-top:6px; font-weight:700;">
                    <span>TOTAL DENDA</span>
                    <span style="color:${totalDenda > 0 ? '#f87171' : '#34d399'};">Rp ${totalDenda.toLocaleString('id-ID')}</span>
                </div>
            </div>
        `;
    });
    html += `</div>`;
    return html;
}

/* ===== THEME TOGGLE ===== */
function toggleTheme() {
  const isLight = document.body.classList.toggle('light-mode');
  localStorage.setItem('ufo_theme', isLight ? 'light' : 'dark');
}
window.toggleTheme = toggleTheme;

(function loadSavedTheme() {
  const saved = localStorage.getItem('ufo_theme');
  if (saved === 'light') {
    document.body.classList.add('light-mode');
  }
})();

/* ===== LOGOUT ===== */
function logoutPromotor() {
  const old = document.getElementById('logoutModal');
  if (old) old.remove();
  const isLight = document.body.classList.contains('light-mode');
  const modal = document.createElement('div');
  modal.id = 'logoutModal';
  modal.style.cssText = `
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    background: ${isLight ? 'rgba(241,245,249,0.7)' : 'rgba(3,7,18,0.85)'};
    backdrop-filter: blur(10px);
    display: flex; justify-content: center; align-items: center;
    z-index: 999999; padding: 16px;
    opacity: 0; transition: opacity 0.25s ease;
  `;
  const cardBg = isLight ? 'linear-gradient(135deg, #ffffff, #fef9ec)' : 'linear-gradient(135deg, rgba(17,24,39,0.98), rgba(35,28,15,0.95))';
  const cardBorder = isLight ? 'rgba(212,175,55,0.6)' : 'rgba(212,175,55,0.5)';
  const titleColor = isLight ? '#111827' : '#ffffff';
  const descColor = isLight ? '#64748b' : '#94a3b8';
  const iconColor = isLight ? '#dc2626' : '#f87171';
  modal.innerHTML = `
    <div id="logoutModalCard" style="
      background: ${cardBg}; border: 2px solid ${cardBorder}; border-radius: 20px;
      padding: 32px 28px; max-width: 380px; width: 100%; text-align: center;
      box-shadow: 0 0 40px rgba(212,175,55,0.25), 0 25px 60px rgba(0,0,0,0.6);
      transform: scale(0.85); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    ">
      <div style="width:72px; height:72px; margin:0 auto 18px; border-radius:50%;
        background: rgba(239,68,68,0.15); border: 2px solid rgba(239,68,68,0.4);
        display:flex; align-items:center; justify-content:center;">
        <svg viewBox="0 0 24 24" style="width:36px; height:36px; stroke:${iconColor}; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round;">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </div>
      <div style="font-size:19px; font-weight:800; color:${titleColor}; margin-bottom:8px;">Konfirmasi Keluar</div>
      <div style="font-size:13.5px; color:${descColor}; margin-bottom:26px;">Apakah Anda yakin ingin keluar?</div>
      <div style="display:flex; gap:10px;">
        <button id="logoutCancelBtn" style="flex:1; padding:13px; background:${isLight?'#f1f5f9':'rgba(148,163,184,0.1)'};
          border:1px solid ${isLight?'#cbd5e1':'rgba(148,163,184,0.3)'}; border-radius:11px;
          color:${isLight?'#475569':'#cbd5e1'}; font-weight:700; cursor:pointer; font-family:inherit;">Batal</button>
        <button id="logoutConfirmBtn" style="flex:1; padding:13px;
          background: linear-gradient(135deg, #ef4444, #b91c1c); border:none; border-radius:11px;
          color:#fff; font-weight:800; cursor:pointer; font-family:inherit;">Keluar</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  requestAnimationFrame(() => {
    modal.style.opacity = '1';
    document.getElementById('logoutModalCard').style.transform = 'scale(1)';
  });
  const closeModal = () => {
    modal.style.opacity = '0';
    document.getElementById('logoutModalCard').style.transform = 'scale(0.9)';
    setTimeout(() => modal.remove(), 250);
  };
  document.getElementById('logoutCancelBtn').onclick = closeModal;
  document.getElementById('logoutConfirmBtn').onclick = async () => {
    closeModal();
    // Bersihkan cache agar user lain di device sama tidak lihat data lama
    try { sessionStorage.clear(); } catch(e) {}
    try {
      await window.firebaseSignOut(window.firebaseAuth);
    } catch(e) { console.error(e); }
    setTimeout(() => location.reload(), 400);
  };
  modal.onclick = (e) => { if (e.target === modal) closeModal(); };
}
window.logoutPromotor = logoutPromotor;
</script>
